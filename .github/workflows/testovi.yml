name: Testovi i objava

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testovi (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    # WebKit is informational until its first green run; Chromium blocks publishing.
    continue-on-error: ${{ matrix.browser == 'webkit' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # upgrade test needs the old version from git history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - run: python tests/run_tests.py
        env:
          BROWSER: ${{ matrix.browser }}

  deploy:
    name: Objava na GitHub Pages
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
