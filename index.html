<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Training">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#101317">
<title>My Training</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --ink:#121417; --panel:#1C2126; --panel2:#242A30; --line:#343B42;
  --chalk:#F2F1ED; --mute:#A7ADB3;
  --steel:#70A982; --green:#006B3E; --green2:#16864F; --amber:#D8952A; --ok:#42B66A; --hot:#D86A5F;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ink); color:var(--chalk);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0;font-weight:780;letter-spacing:-.025em}
.num{font-variant-numeric:tabular-nums;font-weight:780;letter-spacing:-.025em}
header{
  position:sticky;top:0;z-index:20;background:rgba(18,20,23,.93);
  backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.07);
  padding:calc(13px + env(safe-area-inset-top)) 18px 12px;
}
.hrow{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
header h1{font-size:21px;color:var(--chalk)}
.phase{font-size:12px;color:#68C38D;letter-spacing:.055em;text-transform:uppercase;font-weight:700}
main{padding:16px 16px 24px;max-width:640px;margin:0 auto}
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  background:rgba(24,28,32,.98);backdrop-filter:blur(16px);
  border-top:1px solid rgba(255,255,255,.08);padding-bottom:env(safe-area-inset-bottom);
}
nav button{flex:1;background:none;border:0;color:#90979F;font:600 11px/1 inherit;padding:11px 2px 12px;display:flex;flex-direction:column;align-items:center;gap:5px;letter-spacing:.02em;cursor:pointer}
nav button .ic{font-size:19px;line-height:1}
nav button[aria-current="page"]{color:var(--chalk)}
nav button[aria-current="page"] .ic{color:#43B86C}
.card{background:linear-gradient(180deg,#1D2328 0%,#1A2025 100%);border:1px solid #343C44;border-radius:var(--r);padding:15px;margin-bottom:11px;box-shadow:0 8px 24px rgba(0,0,0,.10)}
.card.tight{padding:12px 14px}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.grow{flex:1;min-width:0}.mute{color:var(--mute)}.sm{font-size:13px}.xs{font-size:11.5px;letter-spacing:.065em;text-transform:uppercase;color:#9EA5AD;font-weight:750}.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.btn{background:#252C32;color:var(--chalk);border:1px solid #3A424A;border-radius:11px;padding:11px 14px;font:650 15px inherit;cursor:pointer}
button.btn:active{transform:scale(.985)}
button.btn.pri{background:linear-gradient(135deg,var(--green),var(--green2));color:white;border-color:#16864F;box-shadow:0 5px 16px rgba(0,107,62,.22)}
button.btn.gh{background:none}button.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}button.btn.danger{color:var(--hot)}.btnrow{display:flex;gap:8px;flex-wrap:wrap}
input,select,textarea{background:#252C33;color:var(--chalk);border:1px solid #39424B;border-radius:11px;padding:11px 12px;font:16px inherit;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid #319A61;outline-offset:1px;border-color:#319A61}label.f{display:block;margin-bottom:10px}label.f>span{display:block;margin-bottom:5px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.chip{display:inline-block;background:#232A30;border:1px solid #394149;border-radius:999px;padding:4px 10px;font-size:11.5px;color:#AAB0B6;font-weight:650}.chip.on{background:#0D7044;color:#F5FFF8;border-color:#208E58}
.bar{height:7px;background:#293037;border-radius:99px;overflow:hidden;position:relative}.bar>i{display:block;height:100%;background:#24985B;border-radius:99px}.bar>i.full{background:#42B66A}.bar>i.over{background:var(--amber)}
.setline{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid rgba(255,255,255,.075)}.setline .num{font-size:15px}
dialog{border:0;padding:0;background:none;max-width:520px;width:calc(100% - 24px);color:var(--chalk)}dialog::backdrop{background:rgba(5,7,8,.76)}.sheet{background:#1B2126;border:1px solid #384149;border-radius:18px;padding:16px;max-height:82vh;overflow:auto}.empty{text-align:center;color:var(--mute);padding:30px 10px;font-size:14.5px}.list{display:flex;flex-direction:column;gap:8px}hr.sep{border:0;border-top:1px solid #343B42;margin:12px 0}.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom));background:#242B31;border:1px solid #3A434B;border-radius:12px;padding:10px 15px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}svg.chart{width:100%;height:150px;display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* vNext-ui-fixes */
input[type="date"]{
  min-height:46px;
  line-height:24px;
  text-align:left;
  padding-top:10px;
  padding-bottom:10px;
}
input[type="date"]::-webkit-date-and-time-value{
  text-align:left;
  min-height:24px;
}
nav button .ic{
  width:21px;height:21px;display:flex;align-items:center;justify-content:center;
}
nav button .ic svg{
  width:21px;height:21px;display:block;fill:none;stroke:currentColor;
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;
}

.dateShell{
  position:relative;
  min-height:46px;
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.dateShell:focus-within{
  outline:2px solid var(--steel);
  outline-offset:1px;
  border-color:var(--steel);
}
.dateShell #dateText{
  width:100%;
  text-align:center;
  font:16px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  color:var(--chalk);
  pointer-events:none;
}
.dateShell input[type="date"]{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  opacity:0.001;
  cursor:pointer;
  border:0;
  padding:0;
}

</style>
</head>

function normName(s){return String(s||"").trim().toLocaleLowerCase("sr")}
function clone(x){return JSON.parse(JSON.stringify(x))}
function migrateExerciseCatalog(){
  if(!S||!Array.isArray(S.vezbe))return;

  for(const x of EXERCISE_CATALOG){

function migrateCycles(){
  if(!S)return;
  if(!Array.isArray(S.mezociklusi)||!S.mezociklusi.length){
    const cid=uid(),old=S.ciklus||{},start=old.pocetak||monday((S.dnevnik||[]).map(x=>x.datum).sort()[0]||iso(new Date()));
    S.mezociklusi=[{id:cid,naziv:old.naziv||"M1",pocetak:start,trajanje:Number(old.nedelja)||9,status:"aktivan",sabloni:clone(S.sabloni||[])}];
    S.aktivniMezociklusId=cid;
    (S.dnevnik||[]).forEach(l=>{if(!l.mezociklusId)l.mezociklusId=cid});
  }
  S.mezociklusi.forEach(c=>{if(!Array.isArray(c.sabloni))c.sabloni=clone(S.sabloni||[]);if(!c.trajanje)c.trajanje=9;if(!c.status)c.status=c.id===S.aktivniMezociklusId?"aktivan":"završen"});
  if(!S.aktivniMezociklusId||!S.mezociklusi.some(c=>c.id===S.aktivniMezociklusId)){const c=S.mezociklusi.find(x=>x.status==="aktivan")||S.mezociklusi[S.mezociklusi.length-1];S.aktivniMezociklusId=c.id;c.status="aktivan"}
  const ordered=[...S.mezociklusi].sort((a,b)=>(a.pocetak||"").localeCompare(b.pocetak||""));
  (S.dnevnik||[]).forEach(l=>{if(l.mezociklusId&&S.mezociklusi.some(c=>c.id===l.mezociklusId))return;let c=ordered[0];ordered.forEach(x=>{if((x.pocetak||"")<=l.datum)c=x});if(c)l.mezociklusId=c.id});
  save();
}
function cycleById(id){return (S.mezociklusi||[]).find(c=>c.id===id)}
function previousCycle(c=activeCycle()){if(!c)return null;const a=[...(S.mezociklusi||[])].sort((x,y)=>(x.pocetak||"").localeCompare(y.pocetak||"")),i=a.findIndex(x=>x.id===c.id);return i>0?a[i-1]:null}


function migrateLegacySets(){
  if(!S || !Array.isArray(S.dnevnik))return;
  if(S._setFormatV2)return;

  const out=[];
  let changed=false;

  S.dnevnik.forEach(l=>{
    const n=Math.max(1,Number(l.serije||1));
    if(n<=1){
      out.push({...l,serije:1});
      return;
    }
    changed=true;
    for(let i=0;i<n;i++){
      out.push({
        ...l,
        id:i===0?l.id:uid(),
        serije:1
      });
    }
  });

  S.dnevnik=out;
  S._setFormatV2=true;
  save();
  if(changed)toast("Stari treninzi su prebačeni na prikaz po setovima");
}

function parseRepRange(s){

  const reps=sets.map(x=>Number(x.pon)||0);
  const avgRirVals=sets.map(x=>rirValue(x.rir)).filter(x=>x!=null);
  const avgRir=avgRirVals.length?avgRirVals.reduce((a,b)=>a+b,0)/avgRirVals.length:null;
  const allTop=reps.every(r=>r>=rr.hi);
  const mostlyLow=reps.filter(r=>r<rr.lo).length>=Math.ceil(reps.length/2);
  const atLeastLow=reps.every(r=>r>=rr.lo);

  if(f && String(f.ime||"").toLowerCase().includes("deload")){

  }

  }
  if(allTop && avgRir!=null && avgRir<=1.5){
    return `${vname(item.vezbaId)} — zadrži težinu; gornji broj ponavljanja je već blizu limita.`;
  }
  if(mostlyLow){
    return `${vname(item.vezbaId)} — razmotri manju težinu da se vratiš u ciljni raspon ${rr.lo}–${rr.hi}.`;
  }
  if(atLeastLow){
    return `${vname(item.vezbaId)} — zadrži težinu i pokušaj dodati ponavljanja.`;
  }
  return `${vname(item.vezbaId)} — zadrži težinu i ciljaj stabilniji rezultat u rasponu ${rr.lo}–${rr.hi}.`;
}

function finishWorkout(sab){
  const session=sesija,records=[],groupDone={},exerciseDone=[];
  session.stavke.forEach(s=>{
    const sets=completedSets(s);if(!sets.length)return;
    sets.forEach(u=>records.push({id:uid(),datum:session.datum,mezociklusId:(activeCycle()||{}).id,vezbaId:s.vezbaId,serije:1,pon:Number(u.pon)||null,kg:u.kg===""?null:Number(u.kg),napomena:u.nap||"",rir:u.rir||""}));
    const g=GRUPA[vpod(s.vezbaId)]||vpod(s.vezbaId)||"Ostalo";groupDone[g]=(groupDone[g]||0)+sets.length;
    exerciseDone.push({vezbaId:s.vezbaId,sets,plan:s.plan,ponTarget:s.pon});
  });
  if(!records.length){toast("Nema odrađenih setova");return}
  S.dnevnik.push(...records);save();
  const dur=Math.max(1,Math.round((Date.now()-(session.startTs||Date.now()))/60000)),planAll=session.stavke.reduce((a,s)=>a+Number(s.plan||0),0),actual=records.length,volume=records.reduce((a,l)=>a+(l.kg!=null&&l.pon?Number(l.kg)*Number(l.pon):0),0);
  const progress=[];
  exerciseDone.forEach(x=>{
    const prev=previousWorkoutSets(x.vezbaId,session.datum);if(!prev.length)return;
    const cur=x.sets.map(u=>({kg:u.kg===""?0:Number(u.kg)||0,pon:Number(u.pon)||0}));
    const best=a=>a.reduce((b,z)=>(z.kg>b.kg||(z.kg===b.kg&&z.pon>b.pon))?z:b,{kg:0,pon:0});
    const a=best(cur),b=best(prev.map(z=>({kg:Number(z.kg)||0,pon:Number(z.pon)||0})));
    if(a.kg>b.kg)progress.push(`${vname(x.vezbaId)} · +${(a.kg-b.kg).toFixed(1).replace('.0','')} kg`);
    else if(a.kg===b.kg&&a.pon>b.pon)progress.push(`${vname(x.vezbaId)} · +${a.pon-b.pon} pon. na ${a.kg||"istoj"}${a.kg?" kg":""}`);
  });

  const prs=[],advice=[];
  exerciseDone.forEach(x=>{
    if(isNewPR(x.vezbaId,session.datum,x.sets))prs.push(`${vname(x.vezbaId)} — novi najbolji rezultat`);
    const a=progressionAdvice(x,session.datum,faza(cikNedelja(session.datum),activeCycle()));
    if(a)advice.push(a);
  });

  sesija=null;
  showWorkoutSummary({naziv:sab?sab.naziv:"Trening",datum:session.datum,dur,actual,planAll,volume,groupDone,progress,prs,advice});
}

function workoutMessage(pct){

  if(pct>100)return pick([
    "Bravo, Ivane — danas si prešao plan.",
    "Odlično, Ivane — više od planiranog je odrađeno.",
    "Razbio si, Ivane — plan je premašen."
  ]);
  if(pct===100)return pick([
    "Bravo, Ivane — sve planirano je odrađeno.",
    "Odlično, Ivane — trening završen tačno po planu.",
    "Bravo, Ivane — čistih 100% plana."
  ]);
  if(pct>=90)return pick([
    "Odlično, Ivane — skoro sav plan je završen.",
    "Vrlo dobar trening, Ivane — ostalo je baš malo do punog plana.",
    "Bravo, Ivane — praktično cijeli plan je odrađen."
  ]);
  if(pct>=75)return pick([
    "Dobar trening, Ivane — glavnina plana je odrađena.",
    "Dobro odrađeno, Ivane — većina plana je završena.",
    "Solidan trening, Ivane — glavni dio posla je urađen."
  ]);
  if(pct>=50)return pick([

function detaljVezbe(id){const v=vez(id);if(!v){go("vezbe");return}const cycles=[...(S.mezociklusi||[])].sort((a,b)=>(a.pocetak||"").localeCompare(b.pocetak||"")),all=S.dnevnik.filter(l=>l.vezbaId===id),logs=all.filter(l=>vezCycle==="all"||l.mezociklusId===vezCycle),tjed={};logs.forEach(l=>{const m=monday(l.datum);if(!tjed[m])tjed[m]={kg:0,ser:0};tjed[m].ser+=Number(l.serije||0);if(l.kg!=null&&l.kg>tjed[m].kg)tjed[m].kg=l.kg});const ned=Object.keys(tjed).sort().slice(-10);const stats=cycles.map(c=>{const a=all.filter(l=>l.mezociklusId===c.id);if(!a.length)return null;const kg=Math.max(...a.filter(x=>x.kg!=null).map(x=>Number(x.kg)),0),pon=Math.max(...a.filter(x=>Number(x.kg)===kg).map(x=>Number(x.pon)||0),0),ser=a.reduce((z,x)=>z+Number(x.serije||0),0);return{c,kg,pon,ser}}).filter(Boolean);$("#view").innerHTML=`<button class="btn sm gh" id="nazad" style="margin-bottom:10px">‹ Sve vežbe</button><div class="card"><h2 style="font-size:20px">${esc(v.naziv)}</h2><div class="sm mute" style="margin-top:4px">${esc(v.podgrupa)} · ${esc(GRUPA[v.podgrupa]||"")}${v.oprema?" · "+esc(v.oprema):""}</div>${v.napomena?`<div class="sm" style="margin-top:10px;color:var(--steel)">${esc(v.napomena)}</div>`:""}<div class="btnrow" style="margin-top:12px"><button class="btn sm" id="uredi">Uredi</button></div></div><div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:10px"><button class="chip ${vezCycle==="all"?"on":""}" data-mc="all">Sve</button>${cycles.map(c=>`<button class="chip ${vezCycle===c.id?"on":""}" data-mc="${c.id}" style="white-space:nowrap">${esc(c.naziv)}</button>`).join("")}</div>${stats.length>1?`<div class="card"><div class="xs" style="margin-bottom:8px">Poređenje mezociklusa</div>${stats.map(x=>`<div class="row between" style="padding:7px 0;border-top:1px solid var(--line)"><div><b>${esc(x.c.naziv)}</b><div class="sm mute">${x.ser} radnih serija</div></div><div style="text-align:right"><span class="num">${x.kg||"—"}</span><span class="sm mute"> kg</span><div class="sm mute">${x.pon?x.pon+" pon. na toj težini":""}</div></div></div>`).join("")}</div>`:""}${ned.length?`<div class="card"><div class="xs" style="margin-bottom:10px">Najveća težina po nedeljama</div>${chart(ned.map(n=>tjed[n].kg))}<div class="row between sm mute" style="margin-top:6px"><span>${dmy(ned[0])}</span><span>${dmy(ned[ned.length-1])}</span></div></div>`:""}<div class="xs" style="margin:16px 0 8px">Istorija</div><div class="list">${logs.sort((a,b)=>a.datum<b.datum?1:-1).slice(0,40).map(l=>`<div class="card tight"><div class="row between"><div class="grow"><b class="num">${l.serije} × ${l.pon??"—"}</b><span class="mute sm"> · ${l.kg!=null?l.kg+" kg":"bez tega"}</span>${l.napomena?`<div class="sm mute trunc">${esc(l.napomena)}</div>`:""}</div><div class="sm mute">${dmy(l.datum)}</div></div></div>`).join("")||`<div class="empty">Nema unosa za ovu vežbu.</div>`}</div>`;$("#nazad").onclick=()=>{vezCycle="all";go("vezbe")};$("#uredi").onclick=()=>formaVezbe(v);$("#view").querySelectorAll("[data-mc]").forEach(b=>b.onclick=()=>{vezCycle=b.dataset.mc;render()})}
function chart(vals){if(!vals.length)return"";const w=300,h=110,mx=Math.max(...vals,1),mn=Math.min(...vals.filter(x=>x>0),mx),lo=Math.max(0,mn-(mx-mn||mx*.15)*.4),hi=mx+(mx-lo)*.12||1,pt=vals.map((v,i)=>[vals.length>1?i/(vals.length-1)*w:w/2,h-(v-lo)/(hi-lo)*h]),d=pt.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="var(--green2)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>${pt.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="var(--green2)"/>`).join("")}</svg>`}
function formaVezbe(v){openDlg(`<h2 style="font-size:18px;margin-bottom:12px">${v?"Uredi vežbu":"Nova vežba"}</h2><label class="f"><span class="sm mute">Naziv</span><input id="fN" value="${v?esc(v.naziv):""}"></label><label class="f"><span class="sm mute">Podgrupa</span><select id="fP">${PODGRUPE.map(p=>`<option ${v&&v.podgrupa===p?"selected":""}>${p}</option>`).join("")}</select></label><label class="f"><span class="sm mute">Oprema</span><select id="fO">${["","Sprava","Bučice","Šipka","Sajla","Smith","Kinesis","Sopstvena težina","Elastika","Kardio"].map(o=>`<option ${v&&v.oprema===o?"selected":""}>${o}</option>`).join("")}</select></label><label class="f"><span class="sm mute">Napomena</span><textarea id="fZ" rows="2">${v?esc(v.napomena):""}</textarea></label><div class="btnrow" style="margin-top:4px"><button class="btn pri grow" id="fS">Sačuvaj</button><button class="btn gh" id="fC">Otkaži</button>${v?`<button class="btn gh danger" id="fD">Obriši</button>`:""}</div>`);$("#fC").onclick=closeDlg;$("#fS").onclick=()=>{const n=$("#fN").value.trim();if(!n){toast("Upiši naziv");return}if(v)Object.assign(v,{naziv:n,podgrupa:$("#fP").value,oprema:$("#fO").value,napomena:$("#fZ").value});else S.vezbe.push({id:uid(),naziv:n,podgrupa:$("#fP").value,oprema:$("#fO").value,napomena:$("#fZ").value});save();closeDlg();render();toast("Sačuvano")};if(v)$("#fD").onclick=()=>{if(S.dnevnik.some(l=>l.vezbaId===v.id)){toast("Ne može — vežba ima unose u dnevniku");return}if(confirm("Obrisati vežbu?")){S.vezbe=S.vezbe.filter(x=>x.id!==v.id);save();closeDlg();go("vezbe")}}}
function pickVezba(pod,cb){let f=pod||"";const draw=()=>{const l=S.vezbe.filter(v=>!f||v.podgrupa===f).sort((a,b)=>a.naziv.localeCompare(b.naziv,"sr"));$("#dlgBody").innerHTML=`<h2 style="font-size:18px;margin-bottom:10px">Izaberi vežbu</h2><div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:10px"><button class="chip ${f?"":"on"}" data-p="">Sve</button>${PODGRUPE.map(p=>`<button class="chip ${f===p?"on":""}" data-p="${esc(p)}" style="white-space:nowrap">${esc(p)}</button>`).join("")}</div><div class="list" style="max-height:46vh;overflow:auto">${l.map(v=>`<div class="card tight" data-pick="${v.id}" style="cursor:pointer;margin:0"><b>${esc(v.naziv)}</b><div class="sm mute">${esc(v.podgrupa)}</div></div>`).join("")||`<div class="empty">Nema vežbi.</div>`}</div><button class="btn gh" style="width:100%;margin-top:10px" id="pC">Otkaži</button>`;$("#dlgBody").querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{f=b.dataset.p;draw()});$("#dlgBody").querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{closeDlg();cb(b.dataset.pick)});$("#pC").onclick=closeDlg};$("#dlg").showModal();draw()}

function editCycleDialog(c){openDlg(`<h2 style="font-size:18px;margin-bottom:12px">Uredi mezociklus</h2><label class="f"><span class="sm mute">Naziv</span><input id="eN" value="${esc(c.naziv)}"></label><label class="f"><span class="sm mute">Prvi ponedeljak</span><input type="date" id="eP" value="${esc(c.pocetak)}"></label><label class="f"><span class="sm mute">Trajanje</span><select id="eT">${[6,7,8,9,10,12].map(n=>`<option ${n===Number(c.trajanje)?"selected":""} value="${n}">${n} nedelja</option>`).join("")}</select></label><div class="btnrow"><button class="btn pri grow" id="eS">Sačuvaj</button><button class="btn gh" id="eC">Otkaži</button></div>`);$("#eC").onclick=closeDlg;$("#eS").onclick=()=>{const n=$("#eN").value.trim();if(!n){toast("Upiši naziv");return}c.naziv=n;c.pocetak=monday($("#eP").value||c.pocetak);c.trajanje=Number($("#eT").value)||9;save();closeDlg();render();toast("Sačuvano")}}
function newCycleDialog(){const cur=activeCycle(),next="M"+((S.mezociklusi||[]).length+1);openDlg(`<h2 style="font-size:18px;margin-bottom:12px">Novi mezociklus</h2><label class="f"><span class="sm mute">Naziv</span><input id="mN" value="${esc(next)}"></label><label class="f"><span class="sm mute">Prvi ponedeljak</span><input type="date" id="mP" value="${monday(iso(new Date()))}"></label><label class="f"><span class="sm mute">Trajanje</span><select id="mT">${[6,7,8,9,10,12].map(n=>`<option ${n===9?"selected":""} value="${n}">${n} nedelja</option>`).join("")}</select></label><label class="f"><span class="sm mute">Program</span><select id="mK"><option value="copy">Kopiraj program iz ${esc(cur?cur.naziv:"prethodnog")}</option><option value="empty">Počni sa praznim programom</option></select></label><div class="sm mute" style="margin-bottom:12px">Prethodni mezociklus ostaje sačuvan za poređenje.</div><div class="btnrow"><button class="btn pri grow" id="mS">Kreiraj</button><button class="btn gh" id="mC">Otkaži</button></div>`);$("#mC").onclick=closeDlg;$("#mS").onclick=()=>{const name=$("#mN").value.trim();if(!name){toast("Upiši naziv");return}const start=monday($("#mP").value||iso(new Date())),dur=Number($("#mT").value)||9,copy=$("#mK").value==="copy";if(cur)cur.status="završen";const c={id:uid(),naziv:name,pocetak:start,trajanje:dur,status:"aktivan",sabloni:copy&&cur?clone(cur.sabloni):[]};S.mezociklusi.push(c);S.aktivniMezociklusId=c.id;save();closeDlg();render();toast("Kreiran "+name)}}
function cycleDetail(c){const logs=logsForCycle(c.id),days=new Set(logs.map(l=>l.datum)).size,sets=logs.reduce((a,l)=>a+Number(l.serije||0),0),actual=groupFromSub(logs.reduce((m,l)=>{const p=vpod(l.vezbaId);if(p)m[p]=(m[p]||0)+Number(l.serije||0);return m},{})),B=groupFromSub(planByKey(c.sabloni,"b")),M=groupFromSub(planByKey(c.sabloni,"t3")),V=groupFromSub(planByKey(c.sabloni,"t5"));$("#view").innerHTML=`<button class="btn sm gh" id="mcBack" style="margin-bottom:10px">‹ Mezociklusi</button><div class="card"><div class="row between"><div><h2 style="font-size:20px">${esc(c.naziv)}</h2><div class="sm mute">od ${dmy(c.pocetak)} · ${c.trajanje} nedelja</div></div><span class="chip ${c.status==="aktivan"?"on":""}">${esc(c.status)}</span></div><div class="g2" style="margin-top:14px"><div><div class="num" style="font-size:25px">${days}</div><div class="sm mute">treninga</div></div><div><div class="num" style="font-size:25px">${sets}</div><div class="sm mute">serija</div></div></div></div><div class="card"><div class="xs" style="margin-bottom:8px">Plan sedmično · baza / sredina / vrh</div>${GRUPE_ORDER.filter(g=>B[g]||M[g]||V[g]).map(g=>`<div class="row between" style="padding:7px 0;border-top:1px solid var(--line)"><span>${esc(g)}</span><span class="num">${B[g]||0} · ${M[g]||0} · ${V[g]||0}</span></div>`).join("")||`<div class="empty">Nema programa.</div>`}</div><div class="card"><div class="xs" style="margin-bottom:8px">Stvarno odrađeno u ciklusu</div>${GRUPE_ORDER.filter(g=>actual[g]).map(g=>`<div class="row between" style="padding:7px 0;border-top:1px solid var(--line)"><span>${esc(g)}</span><span class="num">${actual[g]}</span></div>`).join("")||`<div class="empty">Još nema treninga.</div>`}</div>`;$("#mcBack").onclick=()=>go("vise") }
function vVise(f){if(CTX.mc){const c=cycleById(CTX.mc);if(c)return cycleDetail(c)}const c=activeCycle(),uk=S.dnevnik.reduce((a,l)=>a+Number(l.serije||0),0),dana=new Set(S.dnevnik.map(l=>l.datum)).size,cycles=[...(S.mezociklusi||[])].sort((a,b)=>(b.pocetak||"").localeCompare(a.pocetak||""));$("#view").innerHTML=`<div class="card"><div class="row between"><div><div class="xs">Aktivni mezociklus</div><h2 style="font-size:20px;margin-top:3px">${esc(c?c.naziv:"—")}</h2><div class="sm mute">${c?dmy(c.pocetak)+" · "+c.trajanje+" nedelja":""}</div></div><span class="chip on">${c?esc(f.ime):"—"}</span></div><div class="btnrow" style="margin-top:14px"><button class="btn grow" id="cEdit">Uredi</button><button class="btn pri grow" id="cNovi">+ Novi mezociklus</button></div></div><div class="xs" style="margin:16px 0 8px">Istorija mezociklusa</div><div class="list">${cycles.map(x=>{const l=logsForCycle(x.id),sets=l.reduce((a,z)=>a+Number(z.serije||0),0);return `<div class="card tight" data-mcopen="${x.id}" style="cursor:pointer"><div class="row between"><div><b>${esc(x.naziv)}</b><div class="sm mute">${dmy(x.pocetak)} · ${new Set(l.map(z=>z.datum)).size} treninga · ${sets} serija</div></div><span class="chip ${x.id===S.aktivniMezociklusId?"on":""}">${x.id===S.aktivniMezociklusId?"aktivan":"završen"}</span></div></div>`}).join("")}</div><div class="card" style="margin-top:14px"><div class="xs" style="margin-bottom:8px">Ukupno u aplikaciji</div><div class="g3"><div><div class="num" style="font-size:24px">${dana}</div><div class="sm mute">treninga</div></div><div><div class="num" style="font-size:24px">${uk}</div><div class="sm mute">serija</div></div><div><div class="num" style="font-size:24px">${S.vezbe.length}</div><div class="sm mute">vežbi</div></div></div></div><div class="card"><div class="xs" style="margin-bottom:8px">Rezervna kopija</div><div class="sm mute" style="margin-bottom:10px">Podaci žive samo na ovom telefonu. Napravi kopiju s vremena na vreme.</div><div class="btnrow"><button class="btn grow" id="exp">Izvezi podatke</button><button class="btn gh grow" id="imp">Uvezi</button></div><input type="file" id="impF" accept="application/json" hidden></div><button class="btn gh danger" style="width:100%" id="reset">Obriši sve podatke</button>`;$("#cEdit").onclick=()=>editCycleDialog(c);$("#cNovi").onclick=newCycleDialog;$("#view").querySelectorAll("[data-mcopen]").forEach(x=>x.onclick=()=>go("vise",{mc:x.dataset.mcopen,title:"Mezociklus"}));$("#exp").onclick=()=>{const b=new Blob([JSON.stringify(S,null,1)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="trening-"+iso(new Date())+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)};$("#imp").onclick=()=>$("#impF").click();$("#impF").onchange=e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.vezbe||!d.dnevnik)throw 0;if(confirm("Zameniti sve trenutne podatke uvezenim?")){S=d;migrateExerciseCatalog();migrateCycles();migrateLegacySets();save();render();toast("Uvezeno")}}catch(err){toast("Fajl nije ispravan")}};r.readAsText(file)};$("#reset").onclick=()=>{if(confirm("Obrisati sve? Ovo se ne može poništiti.")&&confirm("Sigurno? Napravi kopiju pre brisanja.")){localStorage.removeItem(KEY);load();migrateExerciseCatalog();migrateCycles();migrateLegacySets();render();toast("Obrisano")}}}
function openDlg(html){$("#dlgBody").innerHTML=html;$("#dlg").showModal()}function closeDlg(){$("#dlg").close()}$("#dlg").addEventListener("click",e=>{if(e.target===$("#dlg"))closeDlg()});
load();migrateExerciseCatalog();migrateCycles();render();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}
