<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#101317">
<title>Trening</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{
  --ink:#101317; --panel:#191E25; --panel2:#212832; --line:#2C3541;
  --chalk:#ECE7DA; --mute:#8A94A3;
  --steel:#7FA8C9; --amber:#D9A441; --ok:#6E9E6A; --hot:#C4584C;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ink); color:var(--chalk);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.02em}
.num{font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:-.03em}

header{
  position:sticky;top:0;z-index:20;background:rgba(16,19,23,.94);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
}
.hrow{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
header h1{font-size:20px}
.phase{font-size:12px;color:var(--mute);letter-spacing:.04em;text-transform:uppercase}
main{padding:14px 16px 20px;max-width:640px;margin:0 auto}

nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  background:rgba(25,30,37,.97);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  flex:1;background:none;border:0;color:var(--mute);font:600 11px/1 inherit;
  padding:11px 2px 12px;display:flex;flex-direction:column;align-items:center;gap:5px;
  letter-spacing:.02em;cursor:pointer;
}
nav button .ic{font-size:19px;line-height:1}
nav button[aria-current="page"]{color:var(--chalk)}
nav button[aria-current="page"] .ic{color:var(--amber)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.card.tight{padding:11px 13px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.mute{color:var(--mute)}
.sm{font-size:13px}
.xs{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);font-weight:700}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

button.btn{
  background:var(--panel2);color:var(--chalk);border:1px solid var(--line);
  border-radius:10px;padding:11px 14px;font:600 15px inherit;cursor:pointer;
}
button.btn:active{transform:scale(.98)}
button.btn.pri{background:var(--amber);color:#241A05;border-color:var(--amber)}
button.btn.gh{background:none}
button.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
button.btn.danger{color:var(--hot)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

input,select,textarea{
  background:var(--panel2);color:var(--chalk);border:1px solid var(--line);
  border-radius:10px;padding:11px 12px;font:16px inherit;width:100%;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--steel);outline-offset:1px;border-color:var(--steel)}
label.f{display:block;margin-bottom:10px}
label.f>span{display:block;margin-bottom:5px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

.chip{display:inline-block;background:var(--panel2);border:1px solid var(--line);
  border-radius:999px;padding:3px 9px;font-size:11.5px;color:var(--mute);font-weight:600}
.chip.on{background:var(--steel);color:#0C1720;border-color:var(--steel)}

.bar{height:7px;background:var(--panel2);border-radius:99px;overflow:hidden;position:relative}
.bar>i{display:block;height:100%;background:var(--steel);border-radius:99px}
.bar>i.full{background:var(--ok)}
.bar>i.over{background:var(--amber)}

.setline{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px dashed var(--line)}
.setline .num{font-size:15px}

dialog{
  border:0;padding:0;background:none;max-width:520px;width:calc(100% - 24px);
  color:var(--chalk);
}
dialog::backdrop{background:rgba(6,8,10,.72)}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;max-height:82vh;overflow:auto}
.empty{text-align:center;color:var(--mute);padding:30px 10px;font-size:14.5px}
.list{display:flex;flex-direction:column;gap:8px}
hr.sep{border:0;border-top:1px solid var(--line);margin:12px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));
  background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:10px 15px;
  font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
svg.chart{width:100%;height:150px;display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

/* ---------- derived ---------- */
const vez=id=>S.vezbe.find(v=>v.id===id);
const vname=id=>{const v=vez(id);return v?v.naziv:"—"};
const vpod=id=>{const v=vez(id);return v?v.podgrupa:""};
function cikNedelja(d=iso(new Date())){
  if(!S.ciklus.pocetak)return null;
  const a=new Date(S.ciklus.pocetak+"T00:00:00"),b=new Date(d+"T00:00:00");
  const n=Math.floor((b-a)/864e5/7)+1;
  return n<1?1:n;
}
function faza(n){
  if(n==null)return{ime:"—",kol:"b",rir:"—"};
  if(n<=2)return{ime:"Baza · ned. "+n,kol:"b",rir:"3–4 u rezervi"};
  if(n<=4)return{ime:"Rast 1 · ned. "+n,kol:"t3",rir:"2–3 u rezervi"};
  if(n<=6)return{ime:"Rast 2 · ned. "+n,kol:"t5",rir:"2 u rezervi"};
  if(n<=8)return{ime:"Vrhunac · ned. "+n,kol:"t5",rir:"1–2 u rezervi"};
  if(n===9)return{ime:"Deload · ned. 9",kol:"b",rir:"4–5 u rezervi"};
  return{ime:"Ciklus završen",kol:"t5",rir:"—"};
}
const planSerija=(s,f)=>Number(s[f.kol]??s.b??0);

function planPoPodgrupi(sabIds,f){
  const m={};
  sabIds.forEach(id=>{
    const sab=S.sabloni.find(x=>x.id===id);if(!sab)return;
    sab.stavke.forEach(s=>{const p=vpod(s.vezbaId);if(!p)return;m[p]=(m[p]||0)+planSerija(s,f)});
  });
  return m;
}
function stvarnoPoPodgrupi(pon){
  const m={};
  S.dnevnik.filter(l=>monday(l.datum)===pon).forEach(l=>{
    const p=vpod(l.vezbaId);if(!p)return;m[p]=(m[p]||0)+Number(l.serije||0);
  });
  return m;
}

/* ---------- router ---------- */
let TAB="danas",CTX={};
function go(t,ctx){TAB=t;CTX=ctx||{};render()}
$("#nav").addEventListener("click",e=>{const b=e.target.closest("button[data-t]");if(b)go(b.dataset.t)});

function render(){
  const n=cikNedelja(),f=faza(n);
  $("#phase").textContent=S.ciklus.pocetak?f.ime:"Ciklus nije podešen";
  [...$("#nav").children].forEach(b=>b.setAttribute("aria-current",b.dataset.t===TAB?"page":"false"));
  const t={danas:"Danas",pregled:"Pregled",program:"Program",vezbe:"Vežbe",vise:"Više"}[TAB];
  $("#ttl").textContent=CTX.title||t;
  ({danas:vDanas,pregled:vPregled,program:vProgram,vezbe:vVezbe,vise:vVise}[TAB])(f);
  window.scrollTo(0,CTX.keepScroll?window.scrollY:0);
}

/* ---------- DANAS ---------- */
let sesija=null; // {datum, sabId, stavke:[{vezbaId, plan, unosi:[{serije,pon,kg,nap}]}]}
function vDanas(f){
  const v=$("#view");
  if(!sesija){

function lastKg(vid){
  const l=S.dnevnik.filter(x=>x.vezbaId===vid).sort((a,b)=>a.datum<b.datum?1:-1)[0];
  return l&&l.kg!=null?l.kg:"";
}
function kartStavka(s,i){
  const uk=s.unosi.reduce((a,u)=>a+(Number(u.serije)||0),0);
  return `<div class="card">
    <div class="row between">
      <div class="grow">
        <div class="row" style="gap:6px"><b class="trunc">${esc(vname(s.vezbaId))}</b></div>
        <div class="sm mute">${esc(vpod(s.vezbaId))} · plan ${s.plan} ${s.pon?"× "+esc(s.pon):""} ${s.odmor?"· "+esc(s.odmor):""}</div>
      </div>
      <div class="num" style="font-size:19px;color:${uk>=s.plan?"var(--ok)":"var(--mute)"}">${uk}/${s.plan}</div>
    </div>
    ${s.unosi.map((u,j)=>`
      <div class="setline">
        <input data-f="${i}:${j}:serije" value="${esc(u.serije)}" inputmode="numeric" placeholder="ser" style="width:64px;padding:8px">
        <span class="mute sm">×</span>
        <input data-f="${i}:${j}:pon" value="${esc(u.pon)}" inputmode="numeric" placeholder="pon" style="width:64px;padding:8px">
        <input data-f="${i}:${j}:kg" value="${esc(u.kg)}" inputmode="decimal" placeholder="kg" style="width:74px;padding:8px">
        <button class="btn sm gh danger" data-del="${i}:${j}" aria-label="Obriši">✕</button>
      </div>`).join("")}

function zadnjiTreninzi(){
  const dani=[...new Set(S.dnevnik.map(l=>l.datum))].sort().reverse().slice(0,6);
  if(!dani.length)return `<div class="empty">Još nema treninga. Otvori prvi iznad.</div>`;
  return `<div class="xs" style="margin:16px 0 8px">Poslednji treninzi</div><div class="list">`+
    dani.map(d=>{
      const rows=S.dnevnik.filter(l=>l.datum===d);
      const ser=rows.reduce((a,l)=>a+Number(l.serije||0),0);
      const pods=[...new Set(rows.map(l=>vpod(l.vezbaId)))];
      return `<div class="card tight"><div class="row between">
        <div class="grow"><b>${dmy(d)}</b>
        <div class="sm mute trunc">${esc(pods.slice(0,4).join(" · "))}${pods.length>4?" …":""}</div></div>
        <div class="num">${ser}<span class="sm mute" style="font-weight:600"> ser</span></div></div></div>`;
    }).join("")+`</div>`;
}

}
function detaljVezbe(id){
  const v=vez(id);if(!v){go("vezbe");return}
  const logs=S.dnevnik.filter(l=>l.vezbaId===id);
  const tjed={};
  logs.forEach(l=>{const m=monday(l.datum);
    if(!tjed[m])tjed[m]={kg:0,ser:0};
    tjed[m].ser+=Number(l.serije||0);
    if(l.kg!=null&&l.kg>tjed[m].kg)tjed[m].kg=l.kg;});
  const ned=Object.keys(tjed).sort().slice(-10);
  $("#view").innerHTML=`
    <button class="btn sm gh" id="nazad" style="margin-bottom:10px">‹ Sve vežbe</button>
    <div class="card">
      <h2 style="font-size:20px">${esc(v.naziv)}</h2>
      <div class="sm mute" style="margin-top:4px">${esc(v.podgrupa)} · ${esc(GRUPA[v.podgrupa]||"")}${v.oprema?" · "+esc(v.oprema):""}</div>
      ${v.napomena?`<div class="sm" style="margin-top:10px;color:var(--steel)">${esc(v.napomena)}</div>`:""}
      <div class="btnrow" style="margin-top:12px">
        <button class="btn sm" id="uredi">Uredi</button>
      </div>
    </div>
    ${ned.length?`<div class="card">
      <div class="xs" style="margin-bottom:10px">Najveća težina po nedeljama</div>
      ${chart(ned.map(n=>tjed[n].kg))}
      <div class="row between sm mute" style="margin-top:6px"><span>${dmy(ned[0])}</span><span>${dmy(ned[ned.length-1])}</span></div>
    </div>`:""}
    <div class="xs" style="margin:16px 0 8px">Istorija</div>
    <div class="list">${logs.sort((a,b)=>a.datum<b.datum?1:-1).slice(0,40).map(l=>`
      <div class="card tight"><div class="row between">
        <div class="grow"><b class="num">${l.serije} × ${l.pon??"—"}</b>
          <span class="mute sm"> · ${l.kg!=null?l.kg+" kg":"bez tega"}</span>
          ${l.napomena?`<div class="sm mute trunc">${esc(l.napomena)}</div>`:""}</div>
        <div class="sm mute">${dmy(l.datum)}</div></div></div>`).join("")||`<div class="empty">Nema unosa za ovu vežbu.</div>`}</div>`;
  $("#nazad").onclick=()=>go("vezbe");
  $("#uredi").onclick=()=>formaVezbe(v);
}
function chart(vals){
  if(!vals.length)return"";
  const w=300,h=110,mx=Math.max(...vals,1),mn=Math.min(...vals.filter(x=>x>0),mx);
  const lo=Math.max(0,mn-(mx-mn||mx*.15)*.4),hi=mx+(mx-lo)*.12||1;
  const pt=vals.map((v,i)=>[vals.length>1?i/(vals.length-1)*w:w/2,h-(v-lo)/(hi-lo)*h]);
  const d=pt.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Kretanje težine">
    <path d="${d}" fill="none" stroke="var(--amber)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    ${pt.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="var(--amber)"/>`).join("")}
  </svg>`;
}

        <div class="card tight" data-pick="${v.id}" style="cursor:pointer;margin:0">
          <b>${esc(v.naziv)}</b><div class="sm mute">${esc(v.podgrupa)}</div></div>`).join("")||`<div class="empty">Nema vežbi.</div>`}</div>
      <button class="btn gh" style="width:100%;margin-top:10px" id="pC">Otkaži</button>`;
    $("#dlgBody").querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{f=b.dataset.p;draw()});
    $("#dlgBody").querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{closeDlg();cb(b.dataset.pick)});
    $("#pC").onclick=closeDlg;
  };
  $("#dlg").showModal();draw();
}

/* ---------- VIŠE ---------- */
function vVise(f){
  const uk=S.dnevnik.reduce((a,l)=>a+Number(l.serije||0),0);
  const dana=new Set(S.dnevnik.map(l=>l.datum)).size;
  $("#view").innerHTML=`
    <div class="card">
      <div class="xs" style="margin-bottom:10px">Mezociklus</div>
      <label class="f"><span class="sm mute">Naziv</span><input id="cN" value="${esc(S.ciklus.naziv||"")}"></label>
      <label class="f" style="margin-bottom:6px"><span class="sm mute">Prvi ponedeljak ciklusa</span>
        <input type="date" id="cP" value="${esc(S.ciklus.pocetak||"")}"></label>
      <div class="sm mute">${S.ciklus.pocetak?esc(faza(cikNedelja()).ime)+" · "+esc(faza(cikNedelja()).rir):"Upiši datum da bi se računala faza."}</div>
      <button class="btn" style="width:100%;margin-top:12px" id="cNovi">Započni novi ciklus od danas</button>
    </div>
    <div class="card">
      <div class="xs" style="margin-bottom:8px">Ukupno u aplikaciji</div>
      <div class="g3">
        <div><div class="num" style="font-size:24px">${dana}</div><div class="sm mute">treninga</div></div>
        <div><div class="num" style="font-size:24px">${uk}</div><div class="sm mute">serija</div></div>
        <div><div class="num" style="font-size:24px">${S.vezbe.length}</div><div class="sm mute">vežbi</div></div>
      </div>
    </div>
    <div class="card">
      <div class="xs" style="margin-bottom:8px">Rezervna kopija</div>
      <div class="sm mute" style="margin-bottom:10px">Podaci žive samo na ovom telefonu. Napravi kopiju s vremena na vreme.</div>
      <div class="btnrow">
        <button class="btn grow" id="exp">Izvezi podatke</button>
        <button class="btn gh grow" id="imp">Uvezi</button>
      </div>
      <input type="file" id="impF" accept="application/json" hidden>
    </div>
    <div class="card">
      <div class="xs" style="margin-bottom:8px">Faze ciklusa</div>
      <div class="sm mute" style="line-height:1.7">
        Ned. 1–2 · baza · 3–4 u rezervi<br>
        Ned. 3–4 · +1 serija na označenim vežbama · 2–3 u rezervi<br>
        Ned. 5–6 · još +1 · 2 u rezervi<br>
        Ned. 7–8 · volumen se drži, raste težina · 1–2 u rezervi<br>
        Ned. 9 · deload ili pauza
      </div>
    </div>
    <button class="btn gh danger" style="width:100%" id="reset">Obriši sve podatke</button>`;
  $("#cN").oninput=e=>{S.ciklus.naziv=e.target.value;save()};
  $("#cP").onchange=e=>{S.ciklus.pocetak=e.target.value?monday(e.target.value):"";save();render()};
  $("#cNovi").onclick=()=>{S.ciklus.pocetak=monday(iso(new Date()));save();render();toast("Ciklus počinje "+dmy(S.ciklus.pocetak))};
  $("#exp").onclick=()=>{
    const b=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(b);
    a.download="trening-"+iso(new Date())+".json";a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  };
  $("#imp").onclick=()=>$("#impF").click();
  $("#impF").onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const r=new FileReader();
    r.onload=()=>{try{const d=JSON.parse(r.result);
      if(!d.vezbe||!d.dnevnik)throw 0;
      if(confirm("Zameniti sve trenutne podatke uvezenim?")){S=d;save();render();toast("Uvezeno")}
    }catch(err){toast("Fajl nije ispravan")}};
    r.readAsText(file);
  };
  $("#reset").onclick=()=>{
    if(confirm("Obrisati sve? Ovo se ne može poništiti.")&&confirm("Sigurno? Napravi kopiju pre brisanja.")){
      localStorage.removeItem(KEY);load();render();toast("Obrisano");
    }
  };
}

/* ---------- dialog ---------- */
function openDlg(html){$("#dlgBody").innerHTML=html;$("#dlg").showModal()}
function closeDlg(){$("#dlg").close()}
$("#dlg").addEventListener("click",e=>{if(e.target===$("#dlg"))closeDlg()});

/* ---------- start ---------- */
load();render();
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
</script>
