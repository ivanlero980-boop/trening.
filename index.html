<title>My Training</title>

<style>
:root{
  --ink:#171B20;
  --panel:#222830;
  --panel2:#2B323C;
  --line:#3A4350;
  --chalk:#F0EEE7;
  --mute:#98A2AE;
  --steel:#A7B2BF;
  --g-deep:#0D7044;
  --g-lite:#68C38D;
  --amber:#D9A441;
  --ok:var(--g-deep);
  --hot:#F07B70;
  --on-acc:#F0EEE7;
  --hdr:rgba(18,20,23,.93);
  --hdr-line:rgba(255,255,255,.07);
  --nav:rgba(24,28,32,.98);
  --nav-line:rgba(255,255,255,.08);
  --sep:rgba(255,255,255,.075);
  --shadow:0 8px 24px rgba(0,0,0,.10);
  --backdrop:rgba(5,7,8,.76);
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ink); color:var(--chalk);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0;font-weight:780;letter-spacing:-.025em}
.num{font-variant-numeric:tabular-nums;font-weight:780;letter-spacing:-.025em}
header{
  position:sticky;top:0;z-index:20;background:var(--hdr);
  backdrop-filter:blur(16px);border-bottom:1px solid var(--hdr-line);
  padding:calc(13px + env(safe-area-inset-top)) 18px 12px;
}
.hrow{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
header h1{font-size:21px;color:var(--chalk)}
.phase{font-size:12px;color:var(--g-lite);letter-spacing:.055em;text-transform:uppercase;font-weight:700}
main{padding:16px 16px 24px;max-width:640px;margin:0 auto}
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  background:var(--nav);backdrop-filter:blur(16px);
  border-top:1px solid var(--nav-line);padding-bottom:env(safe-area-inset-bottom);
}
nav button{flex:1;background:none;border:0;color:var(--mute);font:600 11px/1 inherit;padding:11px 2px 12px;display:flex;flex-direction:column;align-items:center;gap:5px;letter-spacing:.02em;cursor:pointer}
nav button .ic{font-size:19px;line-height:1}
nav button[aria-current="page"]{color:var(--chalk)}
nav button[aria-current="page"] .ic{color:var(--g-lite)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:11px;box-shadow:var(--shadow)}
.card.tight{padding:12px 14px}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.grow{flex:1;min-width:0}.mute{color:var(--mute)}.sm{font-size:13px}.xs{font-size:11.5px;letter-spacing:.065em;text-transform:uppercase;color:var(--mute);font-weight:750}.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.btn{background:var(--panel2);color:var(--chalk);border:1px solid var(--line);border-radius:11px;padding:11px 14px;font:650 15px inherit;cursor:pointer}
button.btn:active{transform:scale(.985)}
button.btn.pri{background:linear-gradient(135deg,var(--green),var(--g-lite));color:white;border-color:var(--g-deep);box-shadow:0 5px 16px rgba(0,107,62,.22)}
button.btn.gh{background:none}button.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}button.btn.danger{color:var(--hot)}.btnrow{display:flex;gap:8px;flex-wrap:wrap}
input,select,textarea{background:var(--panel2);color:var(--chalk);border:1px solid var(--line);border-radius:11px;padding:11px 12px;font:16px inherit;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--g-deep);outline-offset:1px;border-color:var(--g-deep)}label.f{display:block;margin-bottom:10px}label.f>span{display:block;margin-bottom:5px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.chip{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:11.5px;color:var(--mute);font-weight:650}.chip.on{background:var(--g-deep);color:var(--chalk);border-color:var(--g-deep)}
.bar{height:7px;background:var(--panel2);border-radius:99px;overflow:hidden;position:relative}.bar>i{display:block;height:100%;background:var(--g-deep);border-radius:99px}.bar>i.full{background:var(--g-lite)}.bar>i.over{background:var(--amber)}
.setline{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--sep)}.setline .num{font-size:15px}
dialog{border:0;padding:0;background:none;max-width:520px;width:calc(100% - 24px);color:var(--chalk)}dialog::backdrop{background:var(--backdrop)}.sheet{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;max-height:82vh;overflow:auto}.empty{text-align:center;color:var(--mute);padding:30px 10px;font-size:14.5px}.list{display:flex;flex-direction:column;gap:8px}hr.sep{border:0;border-top:1px solid var(--line);margin:12px 0}.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom));background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 15px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}svg.chart{width:100%;height:150px;display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* vNext-ui-fixes */
input[type="date"]{
  min-height:46px;
  line-height:24px;
  text-align:left;
  padding-top:10px;
  padding-bottom:10px;
}
input[type="date"]::-webkit-date-and-time-value{
  text-align:left;
  min-height:24px;
}
nav button .ic{
  width:21px;height:21px;display:flex;align-items:center;justify-content:center;
}
nav button .ic svg{
  width:21px;height:21px;display:block;fill:none;stroke:currentColor;
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;
}

.dateShell{
  position:relative;
  min-height:46px;
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.dateShell:focus-within{
  outline:2px solid var(--steel);
  outline-offset:1px;
  border-color:var(--steel);
}
.dateShell #dateText{
  width:100%;
  text-align:center;
  font:16px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  color:var(--chalk);
  pointer-events:none;
}
.dateShell input[type="date"]{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  opacity:0.001;
  cursor:pointer;
  border:0;
  padding:0;
}


.pregledSegments{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:4px;
  width:100%;
}
.pregledSegments .btn{
  width:100%;
  min-width:0;
  padding:9px 3px;
  font-size:12px;
  line-height:1.1;
  white-space:nowrap;
}


/* Stable color semantics */
nav button{color:var(--mute)}
nav button[aria-current="page"]{color:var(--chalk)}
nav button[aria-current="page"] .ic{color:var(--g-lite)}

button.btn.pri{
  background:var(--g-deep);
  color:var(--on-acc);
  border-color:var(--g-deep);
}
button.btn.pri:active{filter:brightness(1.05)}

.chip{
  background:var(--panel2);
  border-color:var(--line);
  color:var(--mute);
}
.chip.on{
  background:var(--g-deep);
  color:var(--on-acc);
  border-color:var(--g-deep);
}

/* Progress: pale green below plan, full green on plan, amber above plan */
.bar>i{
  background:color-mix(in srgb, var(--g-lite) 45%, transparent);
}
.bar>i.full{
  background:var(--g-deep);
}
.bar>i.over{
  background:var(--amber);
}

/* Positive / selected text on dark backgrounds */
.status-ok,.positive,.progress-good{color:var(--g-lite)}


.planStatusRow{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:center;
  gap:10px;
}
.planStatusRow .planStatusText{min-width:0}
.planStatusRow .planStatusText b{display:block;line-height:1.25;overflow-wrap:anywhere}
.planStatusRow .planStatusText .sm{margin-top:4px}
.planStatusRow select{
  width:auto !important;
  max-width:42vw !important;
  min-width:0;
  margin:0;
}
.planStatusRow select{
    width:132px !important;
    max-width:132px !important;
    min-width:132px;
  }
}


.list{
  display:flex;
  flex-direction:column;
  gap:8px;
}
.list>.card{margin-bottom:0;
  font-family:inherit!important;
}


/* Final responsive cleanup */
.planStatusRow{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:center;
  gap:10px;
}
.planStatusRow .planStatusText{min-width:0}
.planStatusRow .planStatusText b{
  display:block;
  line-height:1.25;
  overflow-wrap:anywhere;
}
.planStatusRow .planStatusText .sm{margin-top:4px}
.planStatusRow select{
  width:auto!important;
  max-width:42vw!important;
  min-width:0!important;
  margin:0!important;
}

.list{
  display:flex!important;
  flex-direction:column!important;
  gap:8px!important;
}
.list>.card{
  margin-bottom:0!important;
}

.card,.row,.grow,.trunc{min-width:0}
.card b,.card .sm,.card .xs,label,summary{
  overflow-wrap:anywhere;
  word-break:normal;
}

input,select,textarea{
  font-size:16px!important;
  font-family:inherit!important;
}


button{font:inherit}
/* Finished sets: subtle tint (all themes) */
.setline.done{background:color-mix(in srgb,var(--g-deep) 9%,transparent);border-radius:10px;border-top-color:transparent}

/* ===== Light Stone design layer: designed for a light surface, not just recoloured ===== */
[data-theme="lightStone"] body{font-feature-settings:"tnum" 1}
[data-theme="lightStone"] h1,[data-theme="lightStone"] h2,[data-theme="lightStone"] h3{font-weight:620;letter-spacing:-.015em}
[data-theme="lightStone"] header h1{font-size:22px;font-weight:640}
[data-theme="lightStone"] b{font-weight:600}
[data-theme="lightStone"] .phase{color:var(--mute);font-weight:600;letter-spacing:.07em}
[data-theme="lightStone"] .xs{color:var(--mute);font-weight:600}
[data-theme="lightStone"] .card{border-color:transparent;border-radius:16px}
[data-theme="lightStone"] .card.tight{border-radius:14px}
[data-theme="lightStone"] .sheet{border-color:transparent;border-radius:20px}
[data-theme="lightStone"] input,[data-theme="lightStone"] select,[data-theme="lightStone"] textarea,[data-theme="lightStone"] .dateShell{background:var(--panel2);border-color:transparent}
[data-theme="lightStone"] input:focus,[data-theme="lightStone"] select:focus{outline:1.5px solid var(--g-deep);outline-offset:0;border-color:transparent}
/* Numbers carry the screen: bigger weights and reps */
[data-theme="lightStone"] .setline input{font-size:19px!important;font-weight:600;text-align:center;letter-spacing:-.01em;padding:9px 6px!important}
[data-theme="lightStone"] .setline input::placeholder{color:#B4B8B3;font-weight:500}
[data-theme="lightStone"] .num{font-weight:650;letter-spacing:-.02em}
/* Flat buttons, neutral by default; green only for the primary action */
[data-theme="lightStone"] button.btn{background:var(--panel2);border-color:transparent;font-weight:600;box-shadow:none}
[data-theme="lightStone"] button.btn.gh{background:transparent;border:1px solid var(--line)}
[data-theme="lightStone"] button.btn.pri{background:var(--g-deep);border-color:var(--g-deep);color:#fff;box-shadow:none}
[data-theme="lightStone"] button.btn.danger{color:var(--hot)}
/* Chips: selection is neutral (dark), not green */
[data-theme="lightStone"] .chip{background:var(--panel2);border-color:transparent;color:var(--steel);font-weight:600}
[data-theme="lightStone"] .chip.on{background:var(--chalk);border-color:var(--chalk);color:#fff}
/* Confirmed set: the one place besides the primary button where green appears inside a card */
[data-theme="lightStone"] .setline.done{background:#EAF1EC}
[data-theme="lightStone"] [data-ok].pri{background:var(--g-deep);color:#fff}
[data-theme="lightStone"] [data-ok].gh{border-color:var(--line);color:var(--mute)}
/* Segmented control (Pregled tabs): white pill on stone, no colour */
[data-theme="lightStone"] .pregledSegments{background:var(--panel2);border-radius:12px;padding:3px}
[data-theme="lightStone"] .pregledSegments .btn{background:transparent;border:0;color:var(--mute)}
[data-theme="lightStone"] .pregledSegments .btn.pri{background:#fff;color:var(--chalk);box-shadow:0 1px 3px rgba(30,36,33,.10)}
[data-theme="lightStone"] .card:has(> .pregledSegments){background:transparent;box-shadow:none;padding:0}
/* Progress: thin, calm */
[data-theme="lightStone"] .bar{height:5px;background:#EEECE6}
[data-theme="lightStone"] .bar>i{background:color-mix(in srgb,var(--g-deep) 35%,transparent)}
[data-theme="lightStone"] .bar>i.full{background:var(--g-deep)}
[data-theme="lightStone"] .bar>i.over{background:var(--amber)}
/* Charts: thinner line, smaller points */
[data-theme="lightStone"] svg path[stroke]{stroke-width:1.6}
[data-theme="lightStone"] svg circle{r:2.6px}
/* Navigation: white, fine line icons, green only on the active icon */
[data-theme="lightStone"] nav button{font-weight:550;color:#858B86}
[data-theme="lightStone"] nav button .ic svg{stroke-width:1.55}
[data-theme="lightStone"] nav button[aria-current="page"]{color:var(--chalk)}
[data-theme="lightStone"] nav button[aria-current="page"] .ic{color:var(--g-deep)}
[data-theme="lightStone"] .empty{color:var(--mute)}

/* Danas */
.wkchips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.wkchip{border:1px solid var(--line);background:var(--panel2);color:var(--chalk);border-radius:999px;padding:7px 12px;font:600 13.5px inherit;cursor:pointer}
.wkchip.done{background:var(--g-deep);border-color:var(--g-deep);color:var(--on-acc)}
.wkchip.skip{color:var(--mute);text-decoration:line-through}
.wkchip.next{border-color:var(--g-lite);box-shadow:inset 0 0 0 1px var(--g-lite)}
.linkbtn{border:0!important;background:none!important;color:var(--steel)!important;padding:6px 4px!important;font-weight:600}
.segbar{display:flex;gap:6px}.segbar i{flex:1;height:6px;border-radius:99px;background:var(--panel2)}
.segbar i.done{background:var(--g-deep)}.segbar i.cur{background:color-mix(in srgb,var(--g-deep) 45%,transparent)}
[data-theme="lightStone"] .wkchip{border-color:transparent}
[data-theme="lightStone"] .segbar i{background:#EEECE6}
[data-theme="lightStone"] .segbar i.done{background:var(--g-deep)}
[data-theme="lightStone"] .segbar i.cur{background:color-mix(in srgb,var(--g-deep) 40%,#EEECE6)}

/* Pregled: weekly bars and group volume */
.wkbars{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:142px}
.wkbar{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:pointer;color:var(--mute);font:inherit}
.wkbar i{display:block;width:100%;max-width:44px;border-radius:7px;background:color-mix(in srgb,var(--g-deep) 22%,transparent)}
.wkbar.sel i{background:var(--g-deep)}
.wkbar.run i{background:transparent;border:1.5px dashed var(--g-lite)}
.wkbar .v{font-size:11px;font-weight:650;margin-bottom:3px;color:var(--mute)}
.wkbar .l{font-size:11.5px;margin-top:6px}
.wkbar .c{font-size:10.5px;color:var(--mute);margin-top:1px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.wkbar.cstart{position:relative}.wkbar.cstart::before{content:"";position:absolute;left:-5px;top:14px;bottom:0;border-left:1px dashed var(--line)}
.wkbar.sel .l,.wkbar.sel .v{color:var(--chalk);font-weight:700}
details.grp{padding:8px 0;border-top:1px solid var(--sep)}details.grp:first-of-type{border-top:0}
details.grp summary{list-style:none;cursor:pointer}details.grp summary::-webkit-details-marker{display:none}

/* Touch focus: no ring after a tap, keep it for keyboard */
button:focus:not(:focus-visible){outline:none}
/* Light Stone, everywhere else: cards inside sheets, inputs inside cards, emphasis boxes */
[data-theme="lightStone"] .sheet .card{background:var(--panel2);box-shadow:none}
[data-theme="lightStone"] .sheet .card input,[data-theme="lightStone"] .sheet .card select{background:#fff}
[data-theme="lightStone"] .sheet button.card{background:var(--panel2)}
[data-theme="lightStone"] .card[style*="border-color:var(--g-lite)"]{border-color:transparent!important;background:#EAF1EC}
[data-theme="lightStone"] .card[style*="border-color:var(--amber)"]{border-color:transparent!important;background:#F6EEDF}
[data-theme="lightStone"] .card[style*="border-left:4px solid var(--amber)"]{border-left:3px solid var(--amber)!important}
[data-theme="lightStone"] .themeTile{border-color:transparent;background:var(--panel2)}
[data-theme="lightStone"] .themeTile.on{border-color:var(--chalk)}
[data-theme="lightStone"] details summary{color:var(--steel)}
[data-theme="lightStone"] input[type="checkbox"]{accent-color:var(--g-deep)}

/* Theme preview tiles */
.themeGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.themeTile{border:2px solid var(--line);border-radius:12px;padding:6px;background:none;text-align:left;cursor:pointer;color:var(--chalk)}
.themeTile.on{border-color:var(--g-lite)}
.themeTile .pv{border-radius:8px;padding:8px;height:74px;display:flex;flex-direction:column;gap:5px}
.themeTile .pv i{display:block;border-radius:5px}
</style>
</head>
<body>

<script>
"use strict";
const KEY="trening_v1",SESSION_KEY="trening_v1_session",PREIMPORT_KEY="trening_v1_preimport",SCHEMA_VERSION=2,MIGRATIONS_VERSION=2,LOWER_CORE_FIX_VERSION=1,BUILD_ID="2026.11.27.11.6",BUILD_LABEL="Iteracija 11.6",BUILD_DATE="27.11.2026.";
const CATALOG_VERSION=2;
const CORE_CHOICE_ID="__core_choice__",CORE_CHOICE_LABEL="Core — po izboru";

function monday(d){const x=new Date(d+"T00:00:00");const w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);return iso(x)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

let S=null;

function parseNum(v){
  if(v===null||v===undefined||String(v).trim()==="")return null;
  const n=Number(String(v).trim().replace(",","."));
  return Number.isFinite(n)?n:null;
}
let sessionSaveTimer=null;
function sessionSave(immediate=false){
  clearTimeout(sessionSaveTimer);
  const write=()=>{
    try{
      if(sesija)localStorage.setItem(SESSION_KEY,JSON.stringify({savedAt:Date.now(),session:sesija}));
      else localStorage.removeItem(SESSION_KEY);
    }catch(e){storageFailure("Aktivni trening nije sačuvan. Ne zatvaraj aplikaciju i napravi rezervnu kopiju.")}
  };
  if(immediate)write();
  else sessionSaveTimer=setTimeout(write,300);
}

function sessionClear(){clearTimeout(sessionSaveTimer);try{localStorage.removeItem(SESSION_KEY)}catch(e){}}
function markLegacySession(ses){(ses&&ses.stavke||[]).forEach(x=>(x.unosi||[]).forEach(u=>{if(u.done==null&&String(u.pon??"").trim()!=="")u._legacy=true}));return ses}
function pendingSession(){
  try{
    const raw=localStorage.getItem(SESSION_KEY);if(!raw)return null;
    const p=JSON.parse(raw);
    if(!p||!p.session||!p.savedAt)return null;
    if(Date.now()-Number(p.savedAt)>12*60*60*1000){localStorage.removeItem(SESSION_KEY);return null}
    return p;
  }catch(e){return null}
}

function stateSummary(d){
  const sets=Array.isArray(d&&d.dnevnik)?d.dnevnik.reduce((a,l)=>a+Math.max(1,Number(l.serije)||1),0):0;
  const cycles=Array.isArray(d&&d.mezociklusi)?d.mezociklusi.length:0;
  const dates=Array.isArray(d&&d.dnevnik)?d.dnevnik.map(x=>x.datum).filter(Boolean).sort():[];
  return {sets,cycles,last:dates.length?dates[dates.length-1]:"—"};
}
function validateImport(d){
  if(!d||typeof d!=="object")return false;
  if(!Array.isArray(d.vezbe)||!Array.isArray(d.dnevnik))return false;
  const v=Number(d.schemaVersion||1);
  if(!Number.isFinite(v)||v<1||v>SCHEMA_VERSION)return false;
  return true;
}

function load(){try{const raw=localStorage.getItem(KEY);if(raw){S=JSON.parse(raw);return}}catch(e){}S=seed();save()}
function activeCycle(){return S&&Array.isArray(S.mezociklusi)?S.mezociklusi.find(c=>c.id===S.aktivniMezociklusId)||S.mezociklusi.find(c=>c.status==="aktivan")||S.mezociklusi[S.mezociklusi.length-1]:null}

function cycleForDate(date){
  const cycles=[...(S.mezociklusi||[])].filter(c=>c&&c.pocetak).sort((a,b)=>a.pocetak.localeCompare(b.pocetak));
  if(!cycles.length)return null;
  let chosen=null;
  for(const c of cycles)if(c.pocetak<=date)chosen=c;
  return chosen||cycles[0];
}
function libraryIdForSabId(sid){
  if(!sid)return "";
  for(const c of (S.mezociklusi||[])){
    const s=(c.sabloni||[]).find(x=>x.id===sid);
    if(s)return s.sourceLibraryId||"";
  }
  const l=LIB().find(x=>x.id===sid);
  return l?l.id:"";
}
function sabForLibraryId(c,libId,nth=0){
  if(!c||!libId)return null;
  const all=(c.sabloni||[]).filter(s=>s.sourceLibraryId===libId),live=all.filter(s=>!s.arhiviran);
  return live[nth]||all[nth]||null;
}
// The same workout can appear more than once in a week (e.g. Full body A ×2): each occurrence is its own snapshot.
function identityRepeats(sid,weekStart=pon0){const ident=workoutIdentity(sid);return weeklyPlanIds(weekStart).filter(x=>workoutIdentity(x)===ident).length>1}
// Open period, past week: the plan as it was when that week's workouts were done (ids and contents).
function frozenWeek(weekStart,c=cycleForDate(weekStart)){
  if(!c||!c.otvoren||weekStart>=monday(iso(new Date())))return null;
  const a=S.sedmicniPlanAuto&&S.sedmicniPlanAuto[weekStart];if(!a)return null;
  const ids=Array.isArray(a)?a:(a.ids||[]),sab=Array.isArray(a)?null:a.sabloni;
  const ok=ids.filter(id=>(sab||c.sabloni||[]).some(x=>x.id===id));
  return ok.length?{ids:ok,sabloni:sab}:null;
}
function workoutsForWeek(weekStart,withArchived=false){
  const fr=withArchived?frozenWeek(weekStart):null;if(fr&&fr.sabloni)return fr.sabloni;
  const c=cycleForDate(weekStart)||activeCycle();
  const all=c&&Array.isArray(c.sabloni)?c.sabloni:[];
  return withArchived?all:all.filter(x=>!x.arhiviran);
}

function liveWorkout(snap){
  if(!snap)return snap;
  let lib=null;
  if(snap.sourceLibraryId)lib=LIB().find(x=>x.id===snap.sourceLibraryId);
  if(!lib)lib=LIB().find(x=>normName(cleanWorkoutName(x.naziv))===normName(cleanWorkoutName(snap.naziv)));
  if(!lib)return snap;

  // Library supplies the current exercise selection/name/reps/rest.
  // Mesocycle snapshot supplies progression values b/t3/t5.
  const oldByExercise=new Map((snap.stavke||[]).map(s=>[s.vezbaId,s]));
  const stavke=(lib.stavke||[]).map((s,i)=>{
    const old=oldByExercise.get(s.vezbaId)||(snap.stavke||[])[i];
    const b=Math.max(0,Number(s.b)||0);
    return {...clone(s),
      b,
      t3:old?Math.max(0,b+(Number(old.t3??old.b??b)-Number(old.b??b))):b,
      t5:old?Math.max(0,b+(Number(old.t5??old.b??b)-Number(old.b??b))):b
    };
  });
  return {...clone(lib),id:snap.id,sourceLibraryId:lib.id,stavke};
}
function SAB(){
  const c=activeCycle();
  return c&&Array.isArray(c.sabloni)?c.sabloni:(S.sabloni||[]);
}

function migrateProgramLibrary(){
  if(!S)return;
  if(!Array.isArray(S.programBiblioteka))S.programBiblioteka=[];

  // Repair heuristics are one-time only. Never rewrite user programs on normal startup.
  if(Number(S.migrationsVersion||0)>=MIGRATIONS_VERSION)return;

  const c=activeCycle();
  if(!c||!Array.isArray(c.sabloni)||!c.sabloni.length){
    S.migrationsVersion=MIGRATIONS_VERSION;
    return;
  }

  // First trust the explicit cycle -> program relationship.
  let p=c.sourceProgramId?S.programBiblioteka.find(x=>x.id===c.sourceProgramId):null;

  // For genuinely old data, accept only a program explicitly marked as auto-migrated
  // from this exact cycle. Do not match by name and never use "the only program" fallback.
  if(!p)p=S.programBiblioteka.find(x=>x.migratedFromCycleId===c.id);

  // If a valid relationship already exists, preserve the program exactly as the user left it.
  if(p){
    if(!c.sourceProgramId)c.sourceProgramId=p.id;
    if(!c.programNaziv)c.programNaziv=p.naziv;
    if(!c.frekvencija)c.frekvencija=(p.treningIds||[]).length;
    S.migrationsVersion=MIGRATIONS_VERSION;
    return;
  }

  // Only legacy cycles with no linked program need an automatically created library entry.
  const weekly=S.sedmicniPlan||{};
  const d0=new Date((c.pocetak||iso(new Date()))+"T00:00:00");
  const d1=new Date(d0);d1.setDate(d1.getDate()+Number(c.trajanje||9)*7-1);
  const finish=iso(d1);
  const weeks=Object.keys(weekly)
    .filter(wk=>wk>=c.pocetak&&wk<=finish&&Array.isArray(weekly[wk])&&weekly[wk].length)
    .sort();

  let snapshotIds=[];
  if(weeks.length)snapshotIds=weekly[weeks[weeks.length-1]].slice();
  else snapshotIds=(c.sabloni||[])
    .filter(x=>!/full body c/i.test(cleanWorkoutName(x.naziv))&&x.tip!=="Rezervni")
    .map(x=>x.id);

  const libIds=[];
  snapshotIds.forEach(sid=>{
    const snap=(c.sabloni||[]).find(x=>x.id===sid);
    if(!snap)return;
    let lib=snap.sourceLibraryId?LIB().find(x=>x.id===snap.sourceLibraryId):null;
    if(!lib)lib=LIB().find(x=>normName(cleanWorkoutName(x.naziv))===normName(cleanWorkoutName(snap.naziv)));
    if(lib&&!libIds.includes(lib.id))libIds.push(lib.id);
  });

  if(libIds.length){
    const np={
      id:uid(),
      naziv:(c.naziv||"Program")+" · "+libIds.length+"× nedjeljno",
      treningIds:libIds,
      frekvencija:libIds.length,
      createdAt:iso(new Date()),
      migratedFromCycleId:c.id
    };
    S.programBiblioteka.push(np);
    c.sourceProgramId=np.id;
    c.programNaziv=np.naziv;
    c.frekvencija=libIds.length;
  }

  S.migrationsVersion=MIGRATIONS_VERSION;
}

function cleanWorkoutName(name){
  let n=String(name||"").trim();
  n=n.replace(/^Dan\s+\d+\s*[—–-]\s*/i,"");
  n=n.replace(/\s*[—–-]\s*rezervni\s*$/i,"");
  if(n.toLowerCase()==="rezervni")n="Full body C";
  return n.trim();
}

function migrateWorkoutLibrary(){
  if(!S)return;
  if(!Array.isArray(S.treningBiblioteka)){
    const source=(activeCycle()&&Array.isArray(activeCycle().sabloni)?activeCycle().sabloni:(S.sabloni||[]));
    S.treningBiblioteka=clone(source).map(x=>({...x,libraryId:x.libraryId||uid()}));
  }
  S.treningBiblioteka.forEach(x=>{if(!x.libraryId)x.libraryId=uid()});S.treningBiblioteka.forEach(x=>{
    if(x.tip==="Rezervni")x.tip="Full body";
    x.naziv=cleanWorkoutName(x.naziv);
  });
  (S.mezociklusi||[]).forEach(c=>(c.sabloni||[]).forEach(x=>{
    if(x.tip==="Rezervni")x.tip="Full body";
    x.naziv=cleanWorkoutName(x.naziv);

}

  c.sabloni.filter(sb=>sb.sourceLibraryId===lib.id).forEach(sb=>{
    (sb.stavke||[]).forEach((x,i)=>{const src=(lib.stavke||[]).find(y=>y.id&&y.id===x.id)||(lib.stavke||[]).find(y=>y.vezbaId===x.vezbaId);if(!src)return;x.prog=!!src.prog;x.ss=!!src.ss;
      if(Array.isArray(c.nedelje)){const p=c.progresija||progressionFromWeeks(c.nedelje),b=Math.max(0,Number(x.b)||0);x.t3=Math.max(0,b+(x.prog?p.midAdd:0));x.t5=Math.max(0,b+(x.prog?p.peakAdd:0))}});

function librarySnapshot(ids,progression=null){
  const p=progression||{midAdd:0,peakAdd:0,deloadPct:60};
  return ids.map(id=>LIB().find(x=>x.id===id)).filter(Boolean).map(x=>{
    const y=clone(x);y.sourceLibraryId=x.id;y.id=uid();

  });
}

function migrateCycles(){

    S.mezociklusi=[{id:cid,naziv:old.naziv||"M1",pocetak:start,trajanje:Number(old.nedelja)||9,status:"aktivan",sabloni:clone(S.sabloni||[])}];
    S.aktivniMezociklusId=cid;

  }
  S.mezociklusi.forEach(c=>{if(!Array.isArray(c.sabloni))c.sabloni=clone(S.sabloni||[]);if(!c.trajanje&&!c.otvoren)c.trajanje=9;if(!c.status)c.status=c.id===S.aktivniMezociklusId?"aktivan":"završen"});

// ---- Working without a mesocycle: an open-ended period that runs a program at base sets ----
function programSnapshotIds(p){return (p&&p.treningIds||[]).filter(id=>LIB().some(x=>x.id===id))}
// Ends the running period: kraj = the day before the new period starts (or today if it starts this week or earlier).
function closePeriod(cur,newStart){
  if(!cur)return;cur.status="završen";
  const today=iso(new Date()),d=new Date(newStart+"T00:00:00");d.setDate(d.getDate()-1);const before=iso(d);
  cur.kraj=newStart>today?before:today;if(cur.kraj<cur.pocetak)cur.kraj=cur.pocetak;
}
function startOpenPeriod(p,start){
  if(!p){toast("Izaberi program");return null}
  const ids=programSnapshotIds(p);if(!ids.length){toast("Program nema treninga");return null}
  const cur=activeCycle(),wk=monday(start||iso(new Date()));
  // Switching mid-week: the week follows the new program; sets already done stay in the actual volume.
  if(S.sedmicniPlan&&S.sedmicniPlan[wk])delete S.sedmicniPlan[wk];
  closePeriod(cur,wk);
  // Same Monday as the cycle being closed: the new period takes over that week.
  const c={id:uid(),naziv:p.naziv,otvoren:true,pocetak:wk,trajanje:null,status:"aktivan",frekvencija:ids.length,sourceProgramId:p.id,programNaziv:p.naziv,progresija:{midAdd:0,peakAdd:0},sabloni:librarySnapshot(ids,{midAdd:0,peakAdd:0})};
  if(cur&&cur.pocetak===wk&&!logsForCycle(cur.id).length)S.mezociklusi=S.mezociklusi.filter(x=>x.id!==cur.id);
  S.mezociklusi.push(c);S.aktivniMezociklusId=c.id;S.ciklusPitanje=null;save();return c;
}
// Keep an open period in step with its program (library edits apply right away); snapshot ids stay stable.
function syncOpenPeriod(c=activeCycle()){
  if(!c||!c.otvoren)return;
  const p=PROG().find(x=>x.id===c.sourceProgramId);if(!p)return;
  const ids=programSnapshotIds(p),fresh=librarySnapshot(ids,{midAdd:0,peakAdd:0}),old=c.sabloni||[];
  const seen={},used=new Set();
  const live=fresh.map(f=>{const k=seen[f.sourceLibraryId]||0;seen[f.sourceLibraryId]=k+1;const prev=old.filter(o=>o.sourceLibraryId===f.sourceLibraryId)[k];if(prev){f.id=prev.id;used.add(prev.id)}return f});
  // Workouts removed from the program are kept as archived snapshots so history and past weeks still resolve.
  const archived=old.filter(o=>!used.has(o.id)).map(o=>({...o,arhiviran:true}));
  c.sabloni=[...live,...archived];
  c.naziv=p.naziv;c.programNaziv=p.naziv;c.frekvencija=ids.length;
}
function cycleEnded(c=activeCycle()){if(!c||c.otvoren||!c.pocetak)return false;const n=cikNedelja(iso(new Date()),c);return n!=null&&n>(Number(c.trajanje)||9)}

function migrateLegacySets(){
  if(!S || !Array.isArray(S.dnevnik))return;
  if(S._setFormatV2)return;

  const out=[];
  let changed=false;

  S.dnevnik.forEach(l=>{
    const n=Math.max(1,Number(l.serije||1));
    if(n<=1){
      out.push({...l,serije:1});
      return;
    }
    changed=true;
    for(let i=0;i<n;i++){
      out.push({
        ...l,
        id:i===0?l.id:uid(),
        serije:1
      });
    }
  });

  S.dnevnik=out;
  S._setFormatV2=true;
  save();
  if(changed)toast("Stari treninzi su prebačeni na prikaz po setovima");
}



function repairAccidentalThirdLowerCore(){
  if(!S||Number(S.lowerCoreFixVersion||0)>=LOWER_CORE_FIX_VERSION)return;

  const badLowerSignature=t=>{
    if(!t||String(t.tip||"").toLowerCase()!=="lower"||!Array.isArray(t.stavke))return false;
    if(t.stavke.length!==8)return false;
    const names=t.stavke.map(x=>x&&x.vezbaId===CORE_CHOICE_ID?CORE_CHOICE_LABEL:vname(x&&x.vezbaId));
    return names[0]==="Goblet Squat" &&
      names[1]==="Romanian Deadlift" &&
      names[2]==="Bulgarian Split Squat" &&
      names[3]==="Leg Extension" &&
      names[4]==="Hip Thrust" &&
      names[5]===CORE_CHOICE_LABEL &&
      names[6]===CORE_CHOICE_LABEL &&
      names[7]===CORE_CHOICE_LABEL;
  };

  const fixWorkout=t=>{
    if(!badLowerSignature(t))return false;
    t.stavke=t.stavke.slice(0,7);
    return true;
  };

  (S.treningBiblioteka||[]).forEach(fixWorkout);
  (S.sabloni||[]).forEach(fixWorkout);
  (S.mezociklusi||[]).forEach(c=>(c.sabloni||[]).forEach(fixWorkout));

  try{
    const raw=localStorage.getItem(SESSION_KEY);
    if(raw){
      const p=JSON.parse(raw),session=p&&p.session;
      if(session&&Array.isArray(session.stavke)){
        let source=null;
        if(session.sabId){
          for(const c of (S.mezociklusi||[])){
            source=(c.sabloni||[]).find(t=>t.id===session.sabId);
            if(source)break;
          }
          if(!source)source=(S.sabloni||[]).find(t=>t.id===session.sabId)||null;
        }
        const sessionMatches=badLowerSignature({...session,tip:(source&&source.tip)||session.tip});
        if(sessionMatches){
          session.stavke=session.stavke.slice(0,7);
          localStorage.setItem(SESSION_KEY,JSON.stringify(p));
        }
      }
    }
  }catch(e){}

  S.lowerCoreFixVersion=LOWER_CORE_FIX_VERSION;
}

function cikNedelja(d=iso(new Date()),c=activeCycle()){
  if(!c||!c.pocetak)return null;
  const a=new Date(c.pocetak+"T00:00:00"),b=new Date(d+"T00:00:00");
  const dur=Math.max(1,Number(c.trajanje)||9);
  const n=Math.floor((b-a)/864e5/7)+1;
  if(n<1)return 1;
  if(c.otvoren)return n;
  return n>dur?dur+1:n;
}
function faza(n,c=activeCycle()){if(c&&c.otvoren)return{ime:"bez ciklusa",kol:"b",rir:"po osjećaju",add:0,deload:false,otvoren:true};const dur=Number(c&&c.trajanje)||9;if(n!=null&&n>dur&&c)return{ime:"Ciklus završen",kol:"b",rir:"—",add:0,deload:false};if(c&&Array.isArray(c.nedelje)&&c.nedelje.length===dur&&n!=null&&n>=1&&n<=dur){const w=c.nedelje[n-1];return{ime:weekLabel(w)+" · ned. "+n,kol:w.deload?"b":(Number(w.dodaj)>0?"t5":"b"),rir:w.rir+" u rezervi",add:Number(w.dodaj)||0,deload:!!w.deload,pct:Number(c.deloadPct)||60}}if(n==null)return{ime:"—",kol:"b",rir:"—"};if(n<=2)return{ime:"Baza · ned. "+n,kol:"b",rir:"3–4 u rezervi"};if(n<=4)return{ime:"Rast 1 · ned. "+n,kol:"t3",rir:"2–3 u rezervi"};if(n===dur)return{ime:"Deload · ned. "+dur,kol:"b",rir:"4–5 u rezervi"};if(n>dur)return{ime:"Ciklus završen",kol:"t5",rir:"—"};if(n>=Math.max(5,dur-2))return{ime:"Vrhunac · ned. "+n,kol:"t5",rir:"1–2 u rezervi"};return{ime:"Rast 2 · ned. "+n,kol:"t5",rir:"2 u rezervi"}}
const planSerija=(s,f)=>{
  if(f&&f.add!=null){const b=Math.max(0,Number(s.b)||0);if(f.deload)return b?Math.max(1,Math.round(b*(Number(f.pct)||60)/100)):0;return Math.max(0,b+(s.prog?Number(f.add||0):0))}
  return Number(s[f.kol]??s.b??0);
};
// ---- Mesocycle week table ----
const RIR_OPTS=["4–5","3–4","3","2–3","2","1–2","0–1"];
function weekPreset(dur){
  dur=Math.max(2,Number(dur)||6);const k=dur-1,out=[];
  for(let i=0;i<k;i++){const fr=k>1?i/(k-1):1;out.push({dodaj:fr<0.3?0:(fr<0.65?1:2),rir:RIR_OPTS[1+Math.round(fr*5)],deload:false})}
  out.push({dodaj:0,rir:"4–5",deload:true});
  return out;
}
function weekLabel(w){return w.deload?"Deload":(Number(w.dodaj)>0?"Rast +"+w.dodaj:(Number(w.dodaj)<0?"Lakše "+w.dodaj:"Baza"))}

function legacyWeeks(c){
  const dur=Number(c.trajanje)||9,p=c.progresija||{midAdd:1,peakAdd:2},out=[];
  for(let n=1;n<=dur;n++){const f=faza(n,{trajanje:dur});out.push({dodaj:f.kol==="t3"?Number(p.midAdd||0):(f.kol==="t5"?Number(p.peakAdd||0):0),rir:(f.rir.match(/^[^ ]+/)||["2"])[0],deload:/Deload/.test(f.ime)})}
  return out;
}

function progressionAdvice(item,sessionDate,f){
  const rr=parseRepRange(item.ponTarget||"");
  if(!rr)return null;
  const sets=item.sets||[];
  if(!sets.length)return null;

  const reps=sets.map(x=>Number(x.pon)||0);
  const avgRirVals=sets.map(x=>rirValue(x.rir)).filter(x=>x!=null);
  const avgRir=avgRirVals.length?avgRirVals.reduce((a,b)=>a+b,0)/avgRirVals.length:null;
  const allTop=reps.every(r=>r>=rr.hi);
  const mostlyLow=reps.filter(r=>r<rr.lo).length>=Math.ceil(reps.length/2);
  const atLeastLow=reps.every(r=>r>=rr.lo);

  // Deload: never push progression.
  if(f && String(f.ime||"").toLowerCase().includes("deload")){
    return `${vname(item.vezbaId)} — zadrži ili smanji opterećenje; deload nedjelja.`;
  }

  if(allTop && (avgRir==null || avgRir>=2)){
    return `${vname(item.vezbaId)} — sljedeći put probaj malo veću težinu.`;
  }
  if(allTop && avgRir!=null && avgRir<=1.5){
    return `${vname(item.vezbaId)} — zadrži težinu; gornji broj ponavljanja je već blizu limita.`;
  }
  if(mostlyLow){
    return `${vname(item.vezbaId)} — razmotri manju težinu da se vratiš u ciljni raspon ${rr.lo}–${rr.hi}.`;
  }
  if(atLeastLow){
    return `${vname(item.vezbaId)} — zadrži težinu i pokušaj dodati ponavljanja.`;
  }
  return `${vname(item.vezbaId)} — zadrži težinu i ciljaj stabilniji rezultat u rasponu ${rr.lo}–${rr.hi}.`;
}

function workoutSummaryShareText(r){

function inferLegacyWorkoutIdsForWeek(){
  const result={};
  const planned=weeklyPlanIds(),templates=SAB().filter(s=>planned.includes(s.id));
  const rows=S.dnevnik.filter(l=>monday(l.datum)===pon0);
  const dates=[...new Set(rows.map(l=>l.datum))].sort();
  const used=new Set();
  dates.forEach(d=>{
    const day=rows.filter(l=>l.datum===d);
    // New records already identify their template exactly.
    const explicit=day.find(l=>l.sabId||l.originalSabId);
    if(explicit){used.add(explicit.originalSabId||explicit.sabId);return}
    const ex=new Set(day.map(l=>l.vezbaId));
    let best=null,bestScore=0;
    templates.forEach(s=>{
      if(used.has(s.id))return;
      const sx=new Set((s.stavke||[]).map(x=>x.vezbaId));
      const common=[...ex].filter(id=>sx.has(id)).length;
      const score=common/Math.max(1,new Set([...ex,...sx]).size);
      if(score>bestScore){bestScore=score;best=s}
    });
    // Conservative threshold: enough overlap to avoid inventing a match.
    if(best && bestScore>=0.45){result[best.id]=d;used.add(best.id)}
  });

}

// The app builds a real PDF file itself (pages drawn on canvas, embedded as JPEG) and opens the

const PDF_W=1240,PDF_H=1754,PDF_M=90,PDF_FONT='-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif';
function pdfRenderPages(blocks){

  const text=(t,x,px,w,color,maxW)=>{font(px,w);ctx.fillStyle=color||"#111";const lines=wrap(t,maxW||PDF_W-2*PDF_M-(x-PDF_M));const lh=Math.round(px*1.35);lines.forEach((ln,i)=>ctx.fillText(ln,x,y+i*lh));return lines.length*lh};

  const CW=PDF_W-2*PDF_M;
  newPage();
  blocks.forEach(bk=>{
    if(bk.h1){room(60);y+=text(bk.h1,PDF_M,44,700)+6}
    else if(bk.meta){room(36);y+=text(bk.meta,PDF_M,24,400,"#555")+20}
    else if(bk.h2){room(110);y+=24;y+=text(bk.h2,PDF_M,32,700);y+=8;hline(y,"#bbb");y+=18}
    else if(bk.sub){room(110);y+=10;y+=text(bk.sub,PDF_M,26,700);if(bk.note)y+=text(bk.note,PDF_M,21,400,"#666");y+=6}
    else if(bk.summary){const n=bk.summary.length,gap=16,bw=(CW-gap*(n-1))/n,bh=104;room(bh+20);bk.summary.forEach(([l,v],i)=>{const x=PDF_M+i*(bw+gap);ctx.strokeStyle="#bbb";ctx.lineWidth=2;ctx.strokeRect(x,y,bw,bh);const y0=y;y+=16;text(l,x+18,21,400,"#666",bw-36);y+=32;text(v,x+18,36,700,"#111",bw-36);y=y0});y+=bh+20}
    else if(bk.list){room(70);y+=text(bk.list,PDF_M,24,700);y+=4;bk.items.forEach(it=>{font(23);const lines=wrap(it,CW-40);room(lines.length*31+4);ctx.fillStyle="#111";ctx.fillText("•",PDF_M+8,y);y+=text(it,PDF_M+36,23,400,"#111",CW-40)+4});y+=14}
    else if(bk.table){const t=bk.table,ws=t.widths.map(f=>f*CW),pad=12;
      const head=()=>{font(19,600);room(44);let x=PDF_M;t.head.forEach((h,i)=>{ctx.fillStyle="#555";ctx.fillText(String(h).toUpperCase(),x+pad/2,y+8);x+=ws[i]});y+=38;hline(y,"#bbb");y+=4};
      head();
      t.rows.forEach(r=>{const cells=r.map((c,i)=>{const o=typeof c==="object"&&c?c:{t:c};font(o.small?20:23,o.b?700:400);const lines=wrap(o.t,ws[i]-pad);const sub=o.n?(font(19),wrap(o.n,ws[i]-pad)):[];return{o,lines,sub}});
        const rh=Math.max(...cells.map(c=>c.lines.length*(c.o.small?27:31)+c.sub.length*25))+pad*2;
        if(room(rh))head();
        let x=PDF_M;cells.forEach((c,i)=>{let yy=y+pad;font(c.o.small?20:23,c.o.b?700:400);ctx.fillStyle=c.o.small?"#555":"#111";c.lines.forEach(ln=>{ctx.fillText(ln,x+pad/2,yy);yy+=c.o.small?27:31});font(19);ctx.fillStyle="#666";c.sub.forEach(ln=>{ctx.fillText(ln,x+pad/2,yy);yy+=25});x+=ws[i]});
        y+=rh;hline(y-2)});

  });

}
function pdfFromPages(pages){
  const enc=new TextEncoder(),chunks=[],offs=[];let len=0;
  const push=x=>{const u=typeof x==="string"?enc.encode(x):x;chunks.push(u);len+=u.length};

</div></div>`:""}<div class="sm mute" style="margin-bottom:10px">Podaci žive samo na ovom telefonu. Napravi kopiju s vremena na vrijeme.</div><div class="btnrow"><button class="btn grow" id="exp">Izvezi podatke</button><button class="btn gh grow" id="imp">Uvezi</button></div>${localStorage.getItem(PREIMPORT_KEY)?`<button class="btn gh" style="width:100%;margin-top:8px" id="restorePreImport">Vrati stanje prije posljednjeg importa</button>`:""}<input type="file" id="impF" accept="application/json" hidden></div><button class="btn gh danger" style="width:100%" id="reset">Obriši sve podatke</button>`;$("#view").querySelectorAll("[data-theme]").forEach(b=>b.onclick=()=>{S.tema=b.dataset.theme;save();applyTheme(S.tema);CTX.keepScroll=1;render();CTX.keepScroll=0;toast("Tema: "+THEMES[S.tema].naziv)});bindLibraryShare();(()=>{const a=$("#uIme"),b=$("#uVok");if(a)a.onchange=()=>{S.ime=a.value.trim();save();render();toast("Sačuvano")};if(b)b.onchange=()=>{S.vokativ=b.value.trim();save();toast("Sačuvano")}})();{const ce=$("#cEdit");if(ce)ce.onclick=()=>editCycleDialog(c)}$("#cOpen").onclick=openPeriodDialog;$("#cNovi").onclick=()=>newCycleDialog();const ocp=$("#openCycleProgram");if(ocp)ocp.onclick=()=>{const p=PROG().find(x=>x.id===c.sourceProgramId);if(p){go("program");setTimeout(()=>newProgramDialog(p),0)}};$("#view").querySelectorAll("[data-mcopen]").forEach(x=>x.onclick=()=>go("vise",{mc:x.dataset.mcopen,title:(cycleById(x.dataset.mcopen)||{}).otvoren?"Program":"Mezociklus"}));$("#exp").onclick=()=>{S.schemaVersion=SCHEMA_VERSION;S._backupTrainingCount=backupTrainingCount();S._lastBackup=iso(new Date());save();exportBackup()};$("#imp").onclick=()=>$("#impF").click();$("#impF").onchange=e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!validateImport(d))throw 0;const incoming=stateSummary(d),current=stateSummary(S);const less=incoming.sets<current.sets?`\n\nUPOZORENJE: kopija ima ${current.sets-incoming.sets} setova manje od trenutnog stanja.`:"";const msg=`Uvozim ${incoming.sets} setova, ${incoming.cycles} mezociklusa, posljednji trening ${incoming.last}.\n\nTrenutno imaš ${current.sets} setova i ${current.cycles} mezociklusa.${less}\n\nZamijeniti trenutne podatke?`;if(confirm(msg)&&(!less||confirm("Kopija ima manje podataka. Zaista nastaviti sa uvozom?"))){localStorage.setItem(PREIMPORT_KEY,JSON.stringify(S));S=d;runMigrations();applyTheme(S.tema);render();toast("Uvezeno · prethodno stanje sačuvano")}}catch(err){toast("Fajl nije ispravan ili verzija nije podržana")}};r.readAsText(file)};const rp=$("#restorePreImport");if(rp)rp.onclick=()=>{if(!confirm("Vratiti stanje prije posljednjeg importa?"))return;try{const raw=localStorage.getItem(PREIMPORT_KEY);const d=JSON.parse(raw);if(!validateImport(d))throw 0;S=d;runMigrations();applyTheme(S.tema);render();toast("Prethodno stanje vraćeno")}catch(e){toast("Sačuvano stanje nije ispravno")}};$("#reset").onclick=()=>{if(confirm("Obrisati sve? Ovo se ne može poništiti.")&&confirm("Sigurno? Napravi kopiju prije brisanja.")){localStorage.removeItem(KEY);sessionClear();load();runMigrations();applyTheme(S.tema);requestPersistentStorage();render();
if(S.noviKorisnik){

  const hh=String(when.getHours()).padStart(2,"0"),mm=String(when.getMinutes()).padStart(2,"0");
