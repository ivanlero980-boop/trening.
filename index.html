function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("Nije uspelo čuvanje")}}
function normName(s){return String(s||"").trim().toLocaleLowerCase("sr")}
function migrateExerciseCatalog(){
  if(!S||!Array.isArray(S.vezbe))return;
  const existing=new Set(S.vezbe.map(v=>normName(v.naziv)));
  let added=0;
  for(const x of EXERCISE_CATALOG){
    const k=normName(x.naziv);if(existing.has(k))continue;
    S.vezbe.push({id:uid(),naziv:x.naziv,podgrupa:x.podgrupa,oprema:"",napomena:""});
    existing.add(k);added++;
  }
  if(S.catalogVersion!==CATALOG_VERSION||added){S.catalogVersion=CATALOG_VERSION;save()}
}

function cikNedelja(d=iso(new Date())){if(!S.ciklus.pocetak)return null;const a=new Date(S.ciklus.pocetak+"T00:00:00"),b=new Date(d+"T00:00:00");const n=Math.floor((b-a)/864e5/7)+1;return n<1?1:n}
function faza(n){if(n==null)return{ime:"—",kol:"b",rir:"—"};if(n<=2)return{ime:"Baza · ned. "+n,kol:"b",rir:"3–4 u rezervi"};if(n<=4)return{ime:"Rast 1 · ned. "+n,kol:"t3",rir:"2–3 u rezervi"};if(n<=6)return{ime:"Rast 2 · ned. "+n,kol:"t5",rir:"2 u rezervi"};if(n<=8)return{ime:"Vrhunac · ned. "+n,kol:"t5",rir:"1–2 u rezervi"};if(n===9)return{ime:"Deload · ned. 9",kol:"b",rir:"4–5 u rezervi"};return{ime:"Ciklus završen",kol:"t5",rir:"—"}}
const planSerija=(s,f)=>Number(s[f.kol]??s.b??0);
function planPoPodgrupi(sabIds,f){const m={};sabIds.forEach(id=>{const sab=S.sabloni.find(x=>x.id===id);if(!sab)return;sab.stavke.forEach(s=>{const p=vpod(s.vezbaId);if(!p)return;m[p]=(m[p]||0)+planSerija(s,f)})});return m}
function stvarnoPoPodgrupi(pon){const m={};S.dnevnik.filter(l=>monday(l.datum)===pon).forEach(l=>{const p=vpod(l.vezbaId);if(!p)return;m[p]=(m[p]||0)+Number(l.serije||0)});return m}

);pon0=iso(d);render()}}

function vProgram(f){if(CTX.sab)return editSablon(CTX.sab,f);$("#view").innerHTML=`<div class="list">${S.sabloni.map(s=>{const uk=s.stavke.reduce((a,x)=>a+planSerija(x,f),0);return `<div class="card tight" data-open="${s.id}" style="cursor:pointer"><div class="row between"><div class="grow"><b>${esc(s.naziv)}</b><div class="sm mute">${s.stavke.length} vežbi · ${uk} serija u ovoj fazi</div></div><span class="chip">${esc(s.tip||"—")}</span></div></div>`}).join("")}</div><button class="btn gh" style="width:100%;margin-top:10px" id="novi">+ Novi trening</button>`;$("#view").querySelectorAll("[data-open]").forEach(c=>c.onclick=()=>go("program",{sab:c.dataset.open,title:"Uredi trening"}));$("#novi").onclick=()=>{const s={id:uid(),naziv:"Novi trening",tip:"Full body",stavke:[]};S.sabloni.push(s);save();go("program",{sab:s.id,title:"Uredi trening"})}}
function editSablon(id,f){const s=S.sabloni.find(x=>x.id===id);if(!s){go("program");return}$("#view").innerHTML=`<button class="btn sm gh" id="nazad" style="margin-bottom:10px">‹ Svi treninzi</button><div class="card"><label class="f"><span class="sm mute">Naziv</span><input id="sNaziv" value="${esc(s.naziv)}"></label><label class="f" style="margin-bottom:0"><span class="sm mute">Tip</span><select id="sTip">${["Full body","Upper","Lower","Rezervni"].map(t=>`<option ${t===s.tip?"selected":""}>${t}</option>`).join("")}</select></label><div class="sm mute" style="margin-top:8px">Tip „Rezervni" se ne računa u nedeljni plan.</div></div><div class="xs" style="margin:16px 0 8px">Vežbe · serije baza / od 3. ned / od 5. ned</div><div class="list">${s.stavke.map((x,i)=>`<div class="card tight"><div class="row between"><div class="grow trunc"><b>${esc(vname(x.vezbaId))}</b><div class="sm mute">${esc(vpod(x.vezbaId))}</div></div><div class="btnrow"><button class="btn sm gh" data-up="${i}" ${i===0?"disabled":""}>↑</button><button class="btn sm gh" data-dn="${i}" ${i===s.stavke.length-1?"disabled":""}>↓</button></div></div><div class="g3" style="margin-top:9px"><input data-s="${i}:b" value="${x.b}" inputmode="numeric"><input data-s="${i}:t3" value="${x.t3}" inputmode="numeric"><input data-s="${i}:t5" value="${x.t5}" inputmode="numeric"></div><div class="g2" style="margin-top:8px"><input data-s="${i}:pon" value="${esc(x.pon)}" placeholder="ponavljanja"><input data-s="${i}:odmor" value="${esc(x.odmor)}" placeholder="odmor"></div><div class="btnrow" style="margin-top:9px"><button class="btn sm gh" data-rep="${i}">Zameni vežbu</button><button class="btn sm gh danger" data-rm="${i}">Ukloni</button></div></div>`).join("")}</div><button class="btn gh" style="width:100%;margin-top:8px" id="add">+ Dodaj vežbu</button><hr class="sep"><button class="btn gh danger" style="width:100%" id="obrisi">Obriši ovaj trening</button>`;
  $("#nazad").onclick=()=>go("program");$("#sNaziv").oninput=e=>{s.naziv=e.target.value;save()};$("#sTip").onchange=e=>{s.tip=e.target.value;save();render()};$("#add").onclick=()=>pickVezba(null,vid=>{s.stavke.push({id:uid(),vezbaId:vid,b:3,t3:3,t5:3,pon:"",odmor:""});save();render()});$("#obrisi").onclick=()=>{if(confirm("Obrisati „"+s.naziv+"”?")){S.sabloni=S.sabloni.filter(x=>x.id!==id);save();go("program")}};const V=$("#view");V.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>{const i=+b.dataset.up;[s.stavke[i-1],s.stavke[i]]=[s.stavke[i],s.stavke[i-1]];save();render()});V.querySelectorAll("[data-dn]").forEach(b=>b.onclick=()=>{const i=+b.dataset.dn;[s.stavke[i+1],s.stavke[i]]=[s.stavke[i],s.stavke[i+1]];save();render()});V.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{s.stavke.splice(+b.dataset.rm,1);save();render()});V.querySelectorAll("[data-rep]").forEach(b=>b.onclick=()=>{const i=+b.dataset.rep;pickVezba(vpod(s.stavke[i].vezbaId),vid=>{s.stavke[i].vezbaId=vid;save();render()})});V.querySelectorAll("input[data-s]").forEach(inp=>inp.oninput=()=>{const[i,k]=inp.dataset.s.split(":");s.stavke[+i][k]=["b","t3","t5"].includes(k)?(Number(inp.value)||0):inp.value;save()})}

let filtP="";
function vVezbe(){if(CTX.vez)return detaljVezbe(CTX.vez);const list=S.vezbe.filter(v=>!filtP||v.podgrupa===filtP).sort((a,b)=>a.podgrupa===b.podgrupa?a.naziv.localeCompare(b.naziv,"sr"):PODGRUPE.indexOf(a.podgrupa)-PODGRUPE.indexOf(b.podgrupa));$("#view").innerHTML=`<div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:4px"><button class="chip ${filtP?"":"on"}" data-p="">Sve</button>${PODGRUPE.map(p=>`<button class="chip ${filtP===p?"on":""}" data-p="${esc(p)}" style="white-space:nowrap">${esc(p)}</button>`).join("")}</div><div class="list">${list.map(v=>`<div class="card tight" data-v="${v.id}" style="cursor:pointer"><div class="row between"><div class="grow trunc"><b>${esc(v.naziv)}</b><div class="sm mute">${esc(v.podgrupa)}${v.oprema?" · "+esc(v.oprema):""}</div></div><span class="mute">›</span></div></div>`).join("")||`<div class="empty">Nema vežbi u ovoj podgrupi.</div>`}</div><button class="btn gh" style="width:100%;margin-top:10px" id="nova">+ Nova vežba</button>`;$("#view").querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{filtP=b.dataset.p;render()});$("#view").querySelectorAll("[data-v]").forEach(c=>c.onclick=()=>go("vezbe",{vez:c.dataset.v,title:"Vežba"}));$("#nova").onclick=()=>formaVezbe(null)}
function detaljVezbe(id){const v=vez(id);if(!v){go("vezbe");return}const logs=S.dnevnik.filter(l=>l.vezbaId===id),tjed={};logs.forEach(l=>{const m=monday(l.datum);if(!tjed[m])tjed[m]={kg:0,ser:0};tjed[m].ser+=Number(l.serije||0);if(l.kg!=null&&l.kg>tjed[m].kg)tjed[m].kg=l.kg});const ned=Object.keys(tjed).sort().slice(-10);$("#view").innerHTML=`<button class="btn sm gh" id="nazad" style="margin-bottom:10px">‹ Sve vežbe</button><div class="card"><h2 style="font-size:20px">${esc(v.naziv)}</h2><div class="sm mute" style="margin-top:4px">${esc(v.podgrupa)} · ${esc(GRUPA[v.podgrupa]||"")}${v.oprema?" · "+esc(v.oprema):""}</div>${v.napomena?`<div class="sm" style="margin-top:10px;color:var(--steel)">${esc(v.napomena)}</div>`:""}<div class="btnrow" style="margin-top:12px"><button class="btn sm" id="uredi">Uredi</button></div></div>${ned.length?`<div class="card"><div class="xs" style="margin-bottom:10px">Najveća težina po nedeljama</div>${chart(ned.map(n=>tjed[n].kg))}<div class="row between sm mute" style="margin-top:6px"><span>${dmy(ned[0])}</span><span>${dmy(ned[ned.length-1])}</span></div></div>`:""}<div class="xs" style="margin:16px 0 8px">Istorija</div><div class="list">${logs.sort((a,b)=>a.datum<b.datum?1:-1).slice(0,40).map(l=>`<div class="card tight"><div class="row between"><div class="grow"><b class="num">${l.serije} × ${l.pon??"—"}</b><span class="mute sm"> · ${l.kg!=null?l.kg+" kg":"bez tega"}</span>${l.napomena?`<div class="sm mute trunc">${esc(l.napomena)}</div>`:""}</div><div class="sm mute">${dmy(l.datum)}</div></div></div>`).join("")||`<div class="empty">Nema unosa za ovu vežbu.</div>`}</div>`;$("#nazad").onclick=()=>go("vezbe");$("#uredi").onclick=()=>formaVezbe(v)}
function chart(vals){if(!vals.length)return"";const w=300,h=110,mx=Math.max(...vals,1),mn=Math.min(...vals.filter(x=>x>0),mx),lo=Math.max(0,mn-(mx-mn||mx*.15)*.4),hi=mx+(mx-lo)*.12||1,pt=vals.map((v,i)=>[vals.length>1?i/(vals.length-1)*w:w/2,h-(v-lo)/(hi-lo)*h]),d=pt.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="var(--amber)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>${pt.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="var(--amber)"/>`).join("")}</svg>`}
function formaVezbe(v){openDlg(`<h2 style="font-size:18px;margin-bottom:12px">${v?"Uredi vežbu":"Nova vežba"}</h2><label class="f"><span class="sm mute">Naziv</span><input id="fN" value="${v?esc(v.naziv):""}"></label><label class="f"><span class="sm mute">Podgrupa</span><select id="fP">${PODGRUPE.map(p=>`<option ${v&&v.podgrupa===p?"selected":""}>${p}</option>`).join("")}</select></label><label class="f"><span class="sm mute">Oprema</span><select id="fO">${["","Sprava","Bučice","Šipka","Sajla","Smith","Kinesis","Sopstvena težina","Elastika","Kardio"].map(o=>`<option ${v&&v.oprema===o?"selected":""}>${o}</option>`).join("")}</select></label><label class="f"><span class="sm mute">Napomena</span><textarea id="fZ" rows="2">${v?esc(v.napomena):""}</textarea></label><div class="btnrow" style="margin-top:4px"><button class="btn pri grow" id="fS">Sačuvaj</button><button class="btn gh" id="fC">Otkaži</button>${v?`<button class="btn gh danger" id="fD">Obriši</button>`:""}</div>`);$("#fC").onclick=closeDlg;$("#fS").onclick=()=>{const n=$("#fN").value.trim();if(!n){toast("Upiši naziv");return}if(v)Object.assign(v,{naziv:n,podgrupa:$("#fP").value,oprema:$("#fO").value,napomena:$("#fZ").value});else S.vezbe.push({id:uid(),naziv:n,podgrupa:$("#fP").value,oprema:$("#fO").value,napomena:$("#fZ").value});save();closeDlg();render();toast("Sačuvano")};if(v)$("#fD").onclick=()=>{if(S.dnevnik.some(l=>l.vezbaId===v.id)){toast("Ne može — vežba ima unose u dnevniku");return}if(confirm("Obrisati vežbu?")){S.vezbe=S.vezbe.filter(x=>x.id!==v.id);save();closeDlg();go("vezbe")}}}
function pickVezba(pod,cb){let f=pod||"";const draw=()=>{const l=S.vezbe.filter(v=>!f||v.podgrupa===f).sort((a,b)=>a.naziv.localeCompare(b.naziv,"sr"));$("#dlgBody").innerHTML=`<h2 style="font-size:18px;margin-bottom:10px">Izaberi vežbu</h2><div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:10px"><button class="chip ${f?"":"on"}" data-p="">Sve</button>${PODGRUPE.map(p=>`<button class="chip ${f===p?"on":""}" data-p="${esc(p)}" style="white-space:nowrap">${esc(p)}</button>`).join("")}</div><div class="list" style="max-height:46vh;overflow:auto">${l.map(v=>`<div class="card tight" data-pick="${v.id}" style="cursor:pointer;margin:0"><b>${esc(v.naziv)}</b><div class="sm mute">${esc(v.podgrupa)}</div></div>`).join("")||`<div class="empty">Nema vežbi.</div>`}</div><button class="btn gh" style="width:100%;margin-top:10px" id="pC">Otkaži</button>`;$("#dlgBody").querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{f=b.dataset.p;draw()});$("#dlgBody").querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{closeDlg();cb(b.dataset.pick)});$("#pC").onclick=closeDlg};$("#dlg").showModal();draw()}

function vVise(f){const uk=S.dnevnik.reduce((a,l)=>a+Number(l.serije||0),0),dana=new Set(S.dnevnik.map(l=>l.datum)).size;$("#view").innerHTML=`<div class="card"><div class="xs" style="margin-bottom:10px">Mezociklus</div><label class="f"><span class="sm mute">Naziv</span><input id="cN" value="${esc(S.ciklus.naziv||"")}"></label><label class="f" style="margin-bottom:6px"><span class="sm mute">Prvi ponedeljak ciklusa</span><input type="date" id="cP" value="${esc(S.ciklus.pocetak||"")}"></label><div class="sm mute">${S.ciklus.pocetak?esc(faza(cikNedelja()).ime)+" · "+esc(faza(cikNedelja()).rir):"Upiši datum da bi se računala faza."}</div><button class="btn" style="width:100%;margin-top:12px" id="cNovi">Započni novi ciklus od danas</button></div><div class="card"><div class="xs" style="margin-bottom:8px">Ukupno u aplikaciji</div><div class="g3"><div><div class="num" style="font-size:24px">${dana}</div><div class="sm mute">treninga</div></div><div><div class="num" style="font-size:24px">${uk}</div><div class="sm mute">serija</div></div><div><div class="num" style="font-size:24px">${S.vezbe.length}</div><div class="sm mute">vežbi</div></div></div></div><div class="card"><div class="xs" style="margin-bottom:8px">Rezervna kopija</div><div class="sm mute" style="margin-bottom:10px">Podaci žive samo na ovom telefonu. Napravi kopiju s vremena na vreme.</div><div class="btnrow"><button class="btn grow" id="exp">Izvezi podatke</button><button class="btn gh grow" id="imp">Uvezi</button></div><input type="file" id="impF" accept="application/json" hidden></div><div class="card"><div class="xs" style="margin-bottom:8px">Faze ciklusa</div><div class="sm mute" style="line-height:1.7">Ned. 1–2 · baza · 3–4 u rezervi<br>Ned. 3–4 · +1 serija na označenim vežbama · 2–3 u rezervi<br>Ned. 5–6 · još +1 · 2 u rezervi<br>Ned. 7–8 · volumen se drži, raste težina · 1–2 u rezervi<br>Ned. 9 · deload ili pauza</div></div><button class="btn gh danger" style="width:100%" id="reset">Obriši sve podatke</button>`;
  $("#cN").oninput=e=>{S.ciklus.naziv=e.target.value;save()};$("#cP").onchange=e=>{S.ciklus.pocetak=e.target.value?monday(e.target.value):"";save();render()};$("#cNovi").onclick=()=>{S.ciklus.pocetak=monday(iso(new Date()));save();render();toast("Ciklus počinje "+dmy(S.ciklus.pocetak))};$("#exp").onclick=()=>{const b=new Blob([JSON.stringify(S,null,1)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="trening-"+iso(new Date())+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)};$("#imp").onclick=()=>$("#impF").click();$("#impF").onchange=e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.vezbe||!d.dnevnik)throw 0;if(confirm("Zameniti sve trenutne podatke uvezenim?")){S=d;migrateExerciseCatalog();save();render();toast("Uvezeno")}}catch(err){toast("Fajl nije ispravan")}};r.readAsText(file)};$("#reset").onclick=()=>{if(confirm("Obrisati sve? Ovo se ne može poništiti.")&&confirm("Sigurno? Napravi kopiju pre brisanja.")){localStorage.removeItem(KEY);load();migrateExerciseCatalog();render();toast("Obrisano")}}}
function openDlg(html){$("#dlgBody").innerHTML=html;$("#dlg").showModal()}function closeDlg(){$("#dlg").close()}$("#dlg").addEventListener("click",e=>{if(e.target===$("#dlg"))closeDlg()});
load();migrateExerciseCatalog();render();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}
</script>
