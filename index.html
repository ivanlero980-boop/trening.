<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Training">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#101317">
<title>My Training</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --ink:#171B20;
  --panel:#222830;
  --panel2:#2B323C;
  --line:#3A4350;
  --chalk:#F0EEE7;
  --mute:#98A2AE;
  --steel:#A7B2BF;
  --g-deep:#0D7044;
  --g-lite:#68C38D;
  --amber:#D9A441;
  --ok:var(--g-deep);
  --hot:#F07B70;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ink); color:var(--chalk);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0;font-weight:780;letter-spacing:-.025em}
.num{font-variant-numeric:tabular-nums;font-weight:780;letter-spacing:-.025em}
header{
  position:sticky;top:0;z-index:20;background:rgba(18,20,23,.93);
  backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.07);
  padding:calc(13px + env(safe-area-inset-top)) 18px 12px;
}
.hrow{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
header h1{font-size:21px;color:var(--chalk)}
.phase{font-size:12px;color:var(--g-lite);letter-spacing:.055em;text-transform:uppercase;font-weight:700}
main{padding:16px 16px 24px;max-width:640px;margin:0 auto}
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  background:rgba(24,28,32,.98);backdrop-filter:blur(16px);
  border-top:1px solid rgba(255,255,255,.08);padding-bottom:env(safe-area-inset-bottom);
}
nav button{flex:1;background:none;border:0;color:var(--mute);font:600 11px/1 inherit;padding:11px 2px 12px;display:flex;flex-direction:column;align-items:center;gap:5px;letter-spacing:.02em;cursor:pointer}
nav button .ic{font-size:19px;line-height:1}
nav button[aria-current="page"]{color:var(--chalk)}
nav button[aria-current="page"] .ic{color:var(--g-lite)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:11px;box-shadow:0 8px 24px rgba(0,0,0,.10)}
.card.tight{padding:12px 14px}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.grow{flex:1;min-width:0}.mute{color:var(--mute)}.sm{font-size:13px}.xs{font-size:11.5px;letter-spacing:.065em;text-transform:uppercase;color:var(--mute);font-weight:750}.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.btn{background:var(--panel2);color:var(--chalk);border:1px solid var(--line);border-radius:11px;padding:11px 14px;font:650 15px inherit;cursor:pointer}
button.btn:active{transform:scale(.985)}
button.btn.pri{background:linear-gradient(135deg,var(--green),var(--g-lite));color:white;border-color:var(--g-deep);box-shadow:0 5px 16px rgba(0,107,62,.22)}
button.btn.gh{background:none}button.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}button.btn.danger{color:var(--hot)}.btnrow{display:flex;gap:8px;flex-wrap:wrap}
input,select,textarea{background:var(--panel2);color:var(--chalk);border:1px solid var(--line);border-radius:11px;padding:11px 12px;font:16px inherit;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--g-deep);outline-offset:1px;border-color:var(--g-deep)}label.f{display:block;margin-bottom:10px}label.f>span{display:block;margin-bottom:5px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.chip{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:11.5px;color:var(--mute);font-weight:650}.chip.on{background:var(--g-deep);color:var(--chalk);border-color:var(--g-deep)}
.bar{height:7px;background:var(--panel2);border-radius:99px;overflow:hidden;position:relative}.bar>i{display:block;height:100%;background:var(--g-deep);border-radius:99px}.bar>i.full{background:var(--g-lite)}.bar>i.over{background:var(--amber)}
.setline{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid rgba(255,255,255,.075)}.setline .num{font-size:15px}
dialog{border:0;padding:0;background:none;max-width:520px;width:calc(100% - 24px);color:var(--chalk)}dialog::backdrop{background:rgba(5,7,8,.76)}.sheet{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;max-height:82vh;overflow:auto}.empty{text-align:center;color:var(--mute);padding:30px 10px;font-size:14.5px}.list{display:flex;flex-direction:column;gap:8px}hr.sep{border:0;border-top:1px solid var(--line);margin:12px 0}.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom));background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 15px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}svg.chart{width:100%;height:150px;display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* vNext-ui-fixes */
input[type="date"]{
  min-height:46px;
  line-height:24px;
  text-align:left;
  padding-top:10px;
  padding-bottom:10px;
}
input[type="date"]::-webkit-date-and-time-value{
  text-align:left;
  min-height:24px;
}
nav button .ic{
  width:21px;height:21px;display:flex;align-items:center;justify-content:center;
}
nav button .ic svg{
  width:21px;height:21px;display:block;fill:none;stroke:currentColor;
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;
}

.dateShell{
  position:relative;
  min-height:46px;
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.dateShell:focus-within{
  outline:2px solid var(--steel);
  outline-offset:1px;
  border-color:var(--steel);
}
.dateShell #dateText{
  width:100%;
  text-align:center;
  font:16px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  color:var(--chalk);
  pointer-events:none;
}
.dateShell input[type="date"]{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  opacity:0.001;
  cursor:pointer;
  border:0;
  padding:0;
}


.pregledSegments{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:4px;
  width:100%;
}
.pregledSegments .btn{
  width:100%;
  min-width:0;
  padding:9px 3px;
  font-size:12px;
  line-height:1.1;
  white-space:nowrap;
}


/* Stable color semantics */
nav button{color:var(--mute)}
nav button[aria-current="page"]{color:var(--chalk)}
nav button[aria-current="page"] .ic{color:var(--g-lite)}

button.btn.pri{
  background:var(--g-deep);
  color:var(--chalk);
  border-color:var(--g-deep);
}
button.btn.pri:active{filter:brightness(1.05)}

.chip{
  background:var(--panel2);
  border-color:var(--line);
  color:var(--mute);
}
.chip.on{
  background:var(--g-deep);
  color:var(--chalk);
  border-color:var(--g-deep);
}

/* Progress: pale green below plan, full green on plan, amber above plan */
.bar>i{
  background:color-mix(in srgb, var(--g-lite) 45%, transparent);
}
.bar>i.full{
  background:var(--g-deep);
}
.bar>i.over{
  background:var(--amber);
}

/* Positive / selected text on dark backgrounds */
.status-ok,.positive,.progress-good{color:var(--g-lite)}


.planStatusRow{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:center;
  gap:10px;
}
.planStatusRow .planStatusText{min-width:0}
.planStatusRow .planStatusText b{display:block;line-height:1.25;overflow-wrap:anywhere}
.planStatusRow .planStatusText .sm{margin-top:4px}
.planStatusRow select{
  width:auto !important;
  max-width:42vw !important;
  min-width:0;
  margin:0;
}
.planStatusRow select{
    width:132px !important;
    max-width:132px !important;
    min-width:132px;
  }
}


.list{
  display:flex;
  flex-direction:column;
  gap:8px;
}
.list>.card{margin-bottom:0;
  font-family:inherit!important;
}


/* Final responsive cleanup */
.planStatusRow{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:center;
  gap:10px;
}
.planStatusRow .planStatusText{min-width:0}
.planStatusRow .planStatusText b{
  display:block;
  line-height:1.25;
  overflow-wrap:anywhere;
}
.planStatusRow .planStatusText .sm{margin-top:4px}
.planStatusRow select{
  width:auto!important;
  max-width:42vw!important;
  min-width:0!important;
  margin:0!important;
}

.list{
  display:flex!important;
  flex-direction:column!important;
  gap:8px!important;
}
.list>.card{
  margin-bottom:0!important;
}

.card,.row,.grow,.trunc{min-width:0}
.card b,.card .sm,.card .xs,label,summary{
  overflow-wrap:anywhere;
  word-break:normal;
}

input,select,textarea{
  font-size:16px!important;
  font-family:inherit!important;
}

</style>
</head>

let S=null;

function parseNum(v){
  if(v===null||v===undefined||String(v).trim()==="")return null;
  const n=Number(String(v).trim().replace(",","."));
  return Number.isFinite(n)?n:null;
}
let sessionSaveTimer=null;
function sessionSave(immediate=false){
  clearTimeout(sessionSaveTimer);
  const write=()=>{
    try{
      if(sesija)localStorage.setItem(SESSION_KEY,JSON.stringify({savedAt:Date.now(),session:sesija}));
      else localStorage.removeItem(SESSION_KEY);
    }catch(e){storageFailure("Aktivni trening nije sačuvan. Ne zatvaraj aplikaciju i napravi rezervnu kopiju.")}
  };
  if(immediate)write();
  else sessionSaveTimer=setTimeout(write,300);
}

function sessionClear(){clearTimeout(sessionSaveTimer);try{localStorage.removeItem(SESSION_KEY)}catch(e){}}
function pendingSession(){
  try{
    const raw=localStorage.getItem(SESSION_KEY);if(!raw)return null;
    const p=JSON.parse(raw);
    if(!p||!p.session||!p.savedAt)return null;
    if(Date.now()-Number(p.savedAt)>12*60*60*1000){localStorage.removeItem(SESSION_KEY);return null}
    return p;
  }catch(e){return null}
}

function stateSummary(d){
  const sets=Array.isArray(d&&d.dnevnik)?d.dnevnik.reduce((a,l)=>a+Math.max(1,Number(l.serije)||1),0):0;
  const cycles=Array.isArray(d&&d.mezociklusi)?d.mezociklusi.length:0;
  const dates=Array.isArray(d&&d.dnevnik)?d.dnevnik.map(x=>x.datum).filter(Boolean).sort():[];
  return {sets,cycles,last:dates.length?dates[dates.length-1]:"—"};
}
function validateImport(d){
  if(!d||typeof d!=="object")return false;
  if(!Array.isArray(d.vezbe)||!Array.isArray(d.dnevnik))return false;
  const v=Number(d.schemaVersion||1);
  if(!Number.isFinite(v)||v<1||v>SCHEMA_VERSION)return false;
  return true;
}

function activeCycle(){return S&&Array.isArray(S.mezociklusi)?S.mezociklusi.find(c=>c.id===S.aktivniMezociklusId)||S.mezociklusi.find(c=>c.status==="aktivan")||S.mezociklusi[S.mezociklusi.length-1]:null}

function cycleForDate(date){
  const cycles=[...(S.mezociklusi||[])].filter(c=>c&&c.pocetak).sort((a,b)=>a.pocetak.localeCompare(b.pocetak));
  if(!cycles.length)return null;
  let chosen=null;
  for(const c of cycles)if(c.pocetak<=date)chosen=c;
  return chosen||cycles[0];
}
function libraryIdForSabId(sid){
  if(!sid)return "";
  for(const c of (S.mezociklusi||[])){
    const s=(c.sabloni||[]).find(x=>x.id===sid);
    if(s)return s.sourceLibraryId||"";
  }
  const l=LIB().find(x=>x.id===sid);
  return l?l.id:"";
}
function sabForLibraryId(c,libId){
  if(!c||!libId)return null;
  return (c.sabloni||[]).find(s=>s.sourceLibraryId===libId) || null;
}
function workoutsForWeek(weekStart){
  const c=cycleForDate(weekStart)||activeCycle();
  if(!c)return [];
  const currentMonday=monday(iso(new Date()));
  // Past weeks are historical snapshots. Current/future weeks may use current library definitions.
  return weekStart<currentMonday?(c.sabloni||[]):(c.sabloni||[]).map(liveWorkout);
}

function liveWorkout(snap){
  if(!snap)return snap;
  let lib=null;
  if(snap.sourceLibraryId)lib=LIB().find(x=>x.id===snap.sourceLibraryId);
  if(!lib)lib=LIB().find(x=>normName(cleanWorkoutName(x.naziv))===normName(cleanWorkoutName(snap.naziv)));
  if(!lib)return snap;

  // Library supplies the current exercise selection/name/reps/rest.
  // Mesocycle snapshot supplies progression values b/t3/t5.
  const oldByExercise=new Map((snap.stavke||[]).map(s=>[s.vezbaId,s]));
  const stavke=(lib.stavke||[]).map((s,i)=>{
    const old=oldByExercise.get(s.vezbaId)||(snap.stavke||[])[i];
    const b=Math.max(0,Number(s.b)||0);
    return {...clone(s),
      b,
      t3:old?Math.max(0,b+(Number(old.t3??old.b??b)-Number(old.b??b))):b,
      t5:old?Math.max(0,b+(Number(old.t5??old.b??b)-Number(old.b??b))):b
    };
  });
  return {...clone(lib),id:snap.id,sourceLibraryId:lib.id,stavke};
}
function SAB(){
  const c=activeCycle();
  return c&&Array.isArray(c.sabloni)?c.sabloni.map(liveWorkout):(S.sabloni||[]);
}
function syncLegacy(){const c=activeCycle();if(!c)return;S.ciklus={naziv:c.naziv,pocetak:c.pocetak,nedelja:c.trajanje||9};S.sabloni=clone(c.sabloni)}

function save(){try{syncLegacy();localStorage.setItem(KEY,JSON.stringify(S));storageWriteFailed=false;return true}catch(e){storageFailure();return false}}
async function requestPersistentStorage(){try{if(navigator.storage&&navigator.storage.persist){const already=navigator.storage.persisted?await navigator.storage.persisted():false;if(!already)await navigator.storage.persist()}}catch(e){}}
function normName(s){return String(s||"").trim().toLocaleLowerCase("sr")}

function migrateExerciseCatalog(){
  if(!S||!Array.isArray(S.vezbe))return;
  const existing=new Set(S.vezbe.map(v=>normName(v.naziv)));
  let added=0;
  for(const x of EXERCISE_CATALOG){
    const k=normName(x.naziv);if(existing.has(k))continue;
    S.vezbe.push({id:uid(),naziv:x.naziv,podgrupa:x.podgrupa,oprema:"",napomena:""});existing.add(k);added++;
  }
  if(S.catalogVersion!==CATALOG_VERSION||added){S.catalogVersion=CATALOG_VERSION;save()}
}

function migrateProgramLibrary(){
  if(!S)return;
  if(!Array.isArray(S.programBiblioteka))S.programBiblioteka=[];

  // Repair heuristics are one-time only. Never rewrite user programs on normal startup.
  if(Number(S.migrationsVersion||0)>=MIGRATIONS_VERSION)return;

  const c=activeCycle();
  if(!c||!Array.isArray(c.sabloni)||!c.sabloni.length){
    S.migrationsVersion=MIGRATIONS_VERSION;
    return;
  }

  // First trust the explicit cycle -> program relationship.
  let p=c.sourceProgramId?S.programBiblioteka.find(x=>x.id===c.sourceProgramId):null;

  // For genuinely old data, accept only a program explicitly marked as auto-migrated
  // from this exact cycle. Do not match by name and never use "the only program" fallback.
  if(!p)p=S.programBiblioteka.find(x=>x.migratedFromCycleId===c.id);

  // If a valid relationship already exists, preserve the program exactly as the user left it.
  if(p){
    if(!c.sourceProgramId)c.sourceProgramId=p.id;
    if(!c.programNaziv)c.programNaziv=p.naziv;
    if(!c.frekvencija)c.frekvencija=(p.treningIds||[]).length;
    S.migrationsVersion=MIGRATIONS_VERSION;
    return;
  }

  // Only legacy cycles with no linked program need an automatically created library entry.
  const weekly=S.sedmicniPlan||{};
  const d0=new Date((c.pocetak||iso(new Date()))+"T00:00:00");
  const d1=new Date(d0);d1.setDate(d1.getDate()+Number(c.trajanje||9)*7-1);
  const finish=iso(d1);
  const weeks=Object.keys(weekly)
    .filter(wk=>wk>=c.pocetak&&wk<=finish&&Array.isArray(weekly[wk])&&weekly[wk].length)
    .sort();

  let snapshotIds=[];
  if(weeks.length)snapshotIds=weekly[weeks[weeks.length-1]].slice();
  else snapshotIds=(c.sabloni||[])
    .filter(x=>!/full body c/i.test(cleanWorkoutName(x.naziv))&&x.tip!=="Rezervni")
    .map(x=>x.id);

  const libIds=[];
  snapshotIds.forEach(sid=>{
    const snap=(c.sabloni||[]).find(x=>x.id===sid);
    if(!snap)return;
    let lib=snap.sourceLibraryId?LIB().find(x=>x.id===snap.sourceLibraryId):null;
    if(!lib)lib=LIB().find(x=>normName(cleanWorkoutName(x.naziv))===normName(cleanWorkoutName(snap.naziv)));
    if(lib&&!libIds.includes(lib.id))libIds.push(lib.id);
  });

  if(libIds.length){
    const np={
      id:uid(),
      naziv:(c.naziv||"Program")+" · "+libIds.length+"× nedeljno",
      treningIds:libIds,
      frekvencija:libIds.length,
      createdAt:iso(new Date()),
      migratedFromCycleId:c.id
    };
    S.programBiblioteka.push(np);
    c.sourceProgramId=np.id;
    c.programNaziv=np.naziv;
    c.frekvencija=libIds.length;
  }

  S.migrationsVersion=MIGRATIONS_VERSION;
}
function PROG(){return S.programBiblioteka||[]}
function programSnapshot(p){
  return {sourceProgramId:p.id,programNaziv:p.naziv,frekvencija:p.treningIds.length,sabloni:librarySnapshot(p.treningIds)};
}


function cleanWorkoutName(name){
  let n=String(name||"").trim();
  n=n.replace(/^Dan\s+\d+\s*[—–-]\s*/i,"");
  n=n.replace(/\s*[—–-]\s*rezervni\s*$/i,"");
  if(n.toLowerCase()==="rezervni")n="Full body C";
  return n.trim();
}

function migrateWorkoutLibrary(){
  if(!S)return;
  if(!Array.isArray(S.treningBiblioteka)){
    const source=(activeCycle()&&Array.isArray(activeCycle().sabloni)?activeCycle().sabloni:(S.sabloni||[]));
    S.treningBiblioteka=clone(source).map(x=>({...x,libraryId:x.libraryId||uid()}));
  }
  S.treningBiblioteka.forEach(x=>{if(!x.libraryId)x.libraryId=uid()});S.treningBiblioteka.forEach(x=>{
    if(x.tip==="Rezervni")x.tip="Full body";
    x.naziv=cleanWorkoutName(x.naziv);
  });
  (S.mezociklusi||[]).forEach(c=>(c.sabloni||[]).forEach(x=>{
    if(x.tip==="Rezervni")x.tip="Full body";
    x.naziv=cleanWorkoutName(x.naziv);
  }));

}
function LIB(){return S.treningBiblioteka||[]}
function librarySnapshot(ids,progression=null){
  const p=progression||{midAdd:0,peakAdd:0,deloadPct:60};
  return ids.map(id=>LIB().find(x=>x.id===id)).filter(Boolean).map(x=>{
    const y=clone(x);y.sourceLibraryId=x.id;y.id=uid();
    y.stavke=(y.stavke||[]).map(s=>{
      const b=Math.max(0,Number(s.b)||0);
      return {...s,b,t3:Math.max(0,b+Number(p.midAdd||0)),t5:Math.max(0,b+Number(p.peakAdd||0))};
    });
    return y;
  });
}

function migrateCycles(){
  if(!S)return;

  });

function parseRepRange(s){
  const m=String(s||"").match(/(\d+)\s*[–-]\s*(\d+)/);
  if(m)return {lo:Number(m[1]),hi:Number(m[2])};
  const one=String(s||"").match(/(\d+)/);
  return one?{lo:Number(one[1]),hi:Number(one[1])}:null;
}
function rirValue(r){
  if(r==="0–1")return 1;
  if(r==="2")return 2;
  if(r==="3")return 3;
  if(r==="4+")return 4;
  return null;
}
function bestSet(rows){
  return rows.reduce((b,z)=>{
    const kg=parseNum(z.kg)||0,pon=Number(z.pon)||0;
    const score=kg*1000+pon;
    return score>b.score?{kg,pon,score}:b;
  },{kg:0,pon:0,score:-1});
}
function isNewPR(vid,sessionDate,curSets){
  const prev=S.dnevnik.filter(x=>x.vezbaId===vid&&x.datum<sessionDate);
  if(!prev.length)return false;
  const a=bestSet(curSets),b=bestSet(prev);
  return a.kg>b.kg || (a.kg===b.kg && a.pon>b.pon);
}
function progressionAdvice(item,sessionDate,f){
  const rr=parseRepRange(item.ponTarget||"");
  if(!rr)return null;
  const sets=item.sets||[];
  if(!sets.length)return null;

  const reps=sets.map(x=>Number(x.pon)||0);
  const avgRirVals=sets.map(x=>rirValue(x.rir)).filter(x=>x!=null);
  const avgRir=avgRirVals.length?avgRirVals.reduce((a,b)=>a+b,0)/avgRirVals.length:null;
  const allTop=reps.every(r=>r>=rr.hi);
  const mostlyLow=reps.filter(r=>r<rr.lo).length>=Math.ceil(reps.length/2);
  const atLeastLow=reps.every(r=>r>=rr.lo);

  // Deload: never push progression.
  if(f && String(f.ime||"").toLowerCase().includes("deload")){
    return `${vname(item.vezbaId)} — zadrži ili smanji opterećenje; deload nedjelja.`;
  }

  if(allTop && (avgRir==null || avgRir>=2)){
    return `${vname(item.vezbaId)} — sljedeći put probaj malo veću težinu.`;
  }
  if(allTop && avgRir!=null && avgRir<=1.5){
    return `${vname(item.vezbaId)} — zadrži težinu; gornji broj ponavljanja je već blizu limita.`;
  }
  if(mostlyLow){
    return `${vname(item.vezbaId)} — razmotri manju težinu da se vratiš u ciljni raspon ${rr.lo}–${rr.hi}.`;
  }
  if(atLeastLow){
    return `${vname(item.vezbaId)} — zadrži težinu i pokušaj dodati ponavljanja.`;
  }
  return `${vname(item.vezbaId)} — zadrži težinu i ciljaj stabilniji rezultat u rasponu ${rr.lo}–${rr.hi}.`;
}

function finishWorkout(sab){
  const session=sesija,records=[],groupDone={},exerciseDone=[];
  const sessionCycle=cycleForDate(session.datum)||activeCycle();
  const sessionId=session.sessionId||("sess_"+(session.startTs||Date.now())+"_"+uid());
  session.stavke.forEach(s=>{
    const sets=completedSets(s);if(!sets.length)return;
    sets.forEach(u=>records.push({id:uid(),sessionId,datum:session.datum,mezociklusId:(sessionCycle||{}).id,vezbaId:s.vezbaId,serije:1,pon:Number(u.pon)||null,kg:parseNum(u.kg),napomena:u.nap||"",rir:u.rir||"",sabId:session.sabId||"",originalSabId:session.sabId||"",custom:!!session.custom}));
    const g=GRUPA[vpod(s.vezbaId)]||vpod(s.vezbaId)||"Ostalo";groupDone[g]=(groupDone[g]||0)+sets.length;
    exerciseDone.push({vezbaId:s.vezbaId,sets,plan:s.plan,ponTarget:s.pon});
  });
  if(!records.length){toast("Nema odrađenih setova");return}
  S.dnevnik.push(...records);
  const wk=monday(session.datum);
  if(!S.sedmicniStatus)S.sedmicniStatus={};
  if(!S.sedmicniStatus[wk])S.sedmicniStatus[wk]={};
  if(session.sabId)S.sedmicniStatus[wk][workoutIdentity(session.sabId)]=session.custom?"custom":"done";
  save();
  const dur=Math.max(1,Math.round((Date.now()-(session.startTs||Date.now()))/60000)),planAll=session.stavke.reduce((a,s)=>a+Number(s.plan||0),0),actual=records.length,volume=records.reduce((a,l)=>a+(l.kg!=null&&l.pon?Number(l.kg)*Number(l.pon):0),0);
  const progress=[];
  exerciseDone.forEach(x=>{
    const prev=previousWorkoutSets(x.vezbaId,session.datum);if(!prev.length)return;
    const cur=x.sets.map(u=>({kg:parseNum(u.kg)||0,pon:Number(u.pon)||0}));
    const best=a=>a.reduce((b,z)=>(z.kg>b.kg||(z.kg===b.kg&&z.pon>b.pon))?z:b,{kg:0,pon:0});
    const a=best(cur),b=best(prev.map(z=>({kg:parseNum(z.kg)||0,pon:Number(z.pon)||0})));
    if(a.kg>b.kg)progress.push(`${vname(x.vezbaId)} · +${(a.kg-b.kg).toFixed(1).replace('.0','')} kg`);
    else if(a.kg===b.kg&&a.pon>b.pon)progress.push(`${vname(x.vezbaId)} · +${a.pon-b.pon} pon. na ${a.kg||"istoj"}${a.kg?" kg":""}`);
  });

  const prs=[],advice=[];
  exerciseDone.forEach(x=>{
    if(isNewPR(x.vezbaId,session.datum,x.sets))prs.push(`${vname(x.vezbaId)} — novi najbolji rezultat`);
    const a=progressionAdvice(x,session.datum,faza(cikNedelja(session.datum,sessionCycle),sessionCycle));
    if(a)advice.push(a);
  });

  sesija=null;sessionClear();
  showWorkoutSummary({naziv:sab?sab.naziv:"Trening",datum:session.datum,dur,actual,planAll,volume,groupDone,progress,prs,advice});
}

function workoutMessage(pct){

  if(pct>100)return pick([
    "Bravo, Ivane — danas si prešao plan.",
    "Odlično, Ivane — više od planiranog je odrađeno.",
    "Razbio si, Ivane — plan je premašen."
  ]);
  if(pct===100)return pick([
    "Bravo, Ivane — sve planirano je odrađeno.",
    "Odlično, Ivane — trening završen tačno po planu.",
    "Bravo, Ivane — čistih 100% plana."
  ]);
  if(pct>=90)return pick([
    "Odlično, Ivane — skoro sav plan je završen.",
    "Vrlo dobar trening, Ivane — ostalo je baš malo do punog plana.",
    "Bravo, Ivane — praktično cijeli plan je odrađen."
  ]);
  if(pct>=75)return pick([
    "Dobar trening, Ivane — glavnina plana je odrađena.",
    "Dobro odrađeno, Ivane — većina plana je završena.",
    "Solidan trening, Ivane — glavni dio posla je urađen."
  ]);
  if(pct>=50)return pick([
    "Solidno odrađeno, Ivane — ostalo je prostora do plana.",
    "Dobar temelj, Ivane — odrađen je veći dio treninga.",
    "Trening je odrađen, Ivane — danas si stigao do dobrog dijela plana."
  ]);
  return pick([
    "Trening je zabilježen, Ivane — danas je odrađen manji dio plana.",
    "Ivane, trening je sačuvan. Danas je plan ostao djelimično odrađen.",
    "Zabilježeno, Ivane — danas je bio kraći trening."
  ]);
}

function showWorkoutSummary(r){

function weeklyStatuses(){

function inferLegacyWorkoutIdsForWeek(){
  const result={};
  const planned=weeklyPlanIds(),templates=SAB().filter(s=>planned.includes(s.id));
  const rows=S.dnevnik.filter(l=>monday(l.datum)===pon0);
  const dates=[...new Set(rows.map(l=>l.datum))].sort();
  const used=new Set();
  dates.forEach(d=>{
    const day=rows.filter(l=>l.datum===d);
    // New records already identify their template exactly.
    const explicit=day.find(l=>l.sabId||l.originalSabId);
    if(explicit){used.add(explicit.originalSabId||explicit.sabId);return}
    const ex=new Set(day.map(l=>l.vezbaId));
    let best=null,bestScore=0;
    templates.forEach(s=>{
      if(used.has(s.id))return;
      const sx=new Set((s.stavke||[]).map(x=>x.vezbaId));
      const common=[...ex].filter(id=>sx.has(id)).length;
      const score=common/Math.max(1,new Set([...ex,...sx]).size);
      if(score>bestScore){bestScore=score;best=s}
    });
    // Conservative threshold: enough overlap to avoid inventing a match.
    if(best && bestScore>=0.45){result[best.id]=d;used.add(best.id)}
  });
  return result;
}
function plannedWorkoutStatus(sid){
  const ident=workoutIdentity(sid);
  const st=weeklyStatuses()[ident]||weeklyStatuses()[sid];
  if(st)return st;
  const logs=S.dnevnik.filter(l=>{
    if(monday(l.datum)!==pon0)return false;
    const logSid=l.originalSabId||l.sabId;
    return logSid===sid || workoutIdentity(logSid)===ident;
  });
  if(logs.some(l=>l.custom))return "custom";
  if(logs.length)return "done";
  if(inferLegacyWorkoutIdsForWeek()[sid])return "done";
  return "pending";
}

function defaultWeekPlanIds(c=cycleForDate(pon0)||activeCycle()){
  if(!c)return [];
  let p=null;
  if(c.sourceProgramId)p=PROG().find(x=>x.id===c.sourceProgramId);
  if(!p)p=PROG().find(x=>x.migratedFromCycleId===c.id);
  if(!p&&c.programNaziv)p=PROG().find(x=>x.naziv===c.programNaziv);

  if(p&&Array.isArray(p.treningIds)&&p.treningIds.length){
    const ids=[];
    p.treningIds.forEach(libId=>{
      const snap=sabForLibraryId(c,libId);
      if(snap&&!ids.includes(snap.id))ids.push(snap.id);
    });
    if(ids.length)return ids;
  }
  if(Number(c.frekvencija)>0&&(c.sabloni||[]).length===Number(c.frekvencija))return c.sabloni.map(s=>s.id);
  return (c.sabloni||[]).slice(0,Number(c.frekvencija)||c.sabloni.length).map(s=>s.id);
}
function planEntryToSnapshotId(entry,c){
  if(!c||!entry)return "";
  if((c.sabloni||[]).some(s=>s.id===entry))return entry;
  let libId="";
  // New format: stored directly as library ID.
  if(LIB().some(x=>x.id===entry))libId=entry;
  // Old format: stored as snapshot ID from this or a previous cycle.
  if(!libId)libId=libraryIdForSabId(entry);
  const snap=sabForLibraryId(c,libId);
  return snap?snap.id:"";
}
function storedPlanIdsFromSnapshotIds(ids,c){
  return ids.map(id=>{
    const s=(c&&c.sabloni||[]).find(x=>x.id===id);
    return s&&s.sourceLibraryId?s.sourceLibraryId:id;
  }).filter(Boolean);
}
function weeklyPlanIds(weekStart=pon0,c=cycleForDate(weekStart)||activeCycle()){

  renderSlots();
}
function cycleDetail(c){const logs=logsForCycle(c.id),days=new Set(logs.map(l=>l.datum)).size,sets=logs.reduce((a,l)=>a+Number(l.serije||0),0),actual=groupFromSub(logs.reduce((m,l)=>{const p=vpod(l.vezbaId);if(p)m[p]=(m[p]||0)+Number(l.serije||0);return m},{})),B=groupFromSub(planByKey(c.sabloni,"b")),M=groupFromSub(planByKey(c.sabloni,"t3")),V=groupFromSub(planByKey(c.sabloni,"t5"));$("#view").innerHTML=`<button class="btn sm gh" id="mcBack" style="margin-bottom:10px">‹ Mezociklusi</button><div class="card"><div class="row between"><div><h2 style="font-size:20px">${esc(c.naziv)}</h2><div class="sm mute">od ${dmy(c.pocetak)} · ${c.trajanje} nedelja</div></div><span class="chip ${c.status==="aktivan"?"on":""}">${esc(c.status)}</span></div><div class="g2" style="margin-top:14px"><div><div class="num" style="font-size:25px">${days}</div><div class="sm mute">treninga</div></div><div><div class="num" style="font-size:25px">${sets}</div><div class="sm mute">serija</div></div></div></div><div class="card"><div class="row between"><div><div class="xs">Osnovna nedelja</div><b>${c.sabloni.length}× nedeljno</b></div><span class="chip">${c.trajanje} ned.</span></div><div style="margin-top:8px">${c.sabloni.map(s=>`<div class="sm" style="padding:6px 0;border-top:1px solid var(--line)">${esc(cleanWorkoutName(s.naziv))}</div>`).join("")||`<div class="empty">Nema treninga.</div>`}</div></div><div class="card"><div class="xs" style="margin-bottom:8px">Plan sedmično · baza / sredina / vrh</div>${GRUPE_ORDER.filter(g=>B[g]||M[g]||V[g]).map(g=>`<details style="padding:7px 0;border-top:1px solid var(--line)"><summary class="row between" style="cursor:pointer"><span>${esc(g)}</span><span class="num">${B[g]||0} · ${M[g]||0} · ${V[g]||0}</span></summary><div class="sm mute" style="padding-top:6px">${c.sabloni.map(s=>{const b=workoutVolumeMaps(s,"b").group[g]||0,m=workoutVolumeMaps(s,"t3").group[g]||0,v=workoutVolumeMaps(s,"t5").group[g]||0;return b||m||v?`<div class="row between" style="padding:3px 0"><span>${esc(cleanWorkoutName(s.naziv))}</span><span class="num">${b} · ${m} · ${v}</span></div>`:""}).join("")}</div></details>`).join("")||`<div class="empty">Nema programa.</div>`}</div><div class="card"><div class="xs" style="margin-bottom:8px">Stvarno odrađeno u ciklusu</div>${GRUPE_ORDER.filter(g=>actual[g]).map(g=>`<div class="row between" style="padding:7px 0;border-top:1px solid var(--line)"><span>${esc(g)}</span><span class="num">${actual[g]}</span></div>`).join("")||`<div class="empty">Još nema treninga.</div>`}</div>`;$("#mcBack").onclick=()=>go("vise") }

function backupTrainingCount(){
  return new Set(S.dnevnik.map(l=>l.datum)).size;
}
function trainingsSinceBackup(){
  const now=backupTrainingCount();
  const base=Number(S._backupTrainingCount||0);
  return Math.max(0,now-base);
}

function vVise(f){if(CTX.mc){const c=cycleById(CTX.mc);if(c)return cycleDetail(c)}const c=activeCycle(),uk=S.dnevnik.reduce((a,l)=>a+Number(l.serije||0),0),dana=new Set(S.dnevnik.map(l=>l.datum)).size,cycles=[...(S.mezociklusi||[])].sort((a,b)=>(b.pocetak||"").localeCompare(a.pocetak||""));$("#view").innerHTML=`<div class="card"><div class="row between"><div><div class="xs">Aktivni mezociklus</div><h2 style="font-size:20px;margin-top:3px">${esc(c?c.naziv:"—")}</h2><div class="sm mute">${c?dmy(c.pocetak)+" · "+c.trajanje+" nedelja":""}</div></div><span class="chip on">${c?esc(f.ime):"—"}</span></div><div class="btnrow" style="margin-top:14px"><button class="btn grow" id="cEdit">Uredi</button><button class="btn pri grow" id="cNovi">+ Novi mezociklus</button></div></div><div class="xs" style="margin:16px 0 8px">Istorija mezociklusa</div><div class="list">${cycles.map(x=>{const l=logsForCycle(x.id),sets=l.reduce((a,z)=>a+Number(z.serije||0),0);return `<div class="card tight" data-mcopen="${x.id}" style="cursor:pointer"><div class="row between"><div><b>${esc(cleanWorkoutName(x.naziv))}</b><div class="sm mute">${dmy(x.pocetak)} · ${new Set(l.map(z=>z.datum)).size} treninga · ${sets} serija</div></div><span class="chip ${x.id===S.aktivniMezociklusId?"on":""}">${x.id===S.aktivniMezociklusId?"aktivan":"završen"}</span></div></div>`}).join("")}</div><div class="card" style="margin-top:14px"><div class="xs" style="margin-bottom:8px">Ukupno u aplikaciji</div><div class="g3"><div><div class="num" style="font-size:24px">${dana}</div><div class="sm mute">treninga</div></div><div><div class="num" style="font-size:24px">${uk}</div><div class="sm mute">serija</div></div><div><div class="num" style="font-size:24px">${S.vezbe.length}</div><div class="sm mute">vežbi</div></div></div></div><div class="card"><div class="row between"><div><div class="xs">Verzija aplikacije</div><b>${esc(BUILD_LABEL)}</b><div class="sm mute">Build ${esc(BUILD_ID)} · ${esc(BUILD_DATE)}</div></div><span class="chip">PWA</span></div></div><div class="card"><div class="xs" style="margin-bottom:8px">Rezervna kopija</div>${trainingsSinceBackup()>=10?`<div style="padding:9px 10px;margin-bottom:10px;border:1px solid var(--amber);border-radius:9px"><b>Vrijeme je za sigurnosnu kopiju</b><div class="sm mute">${trainingsSinceBackup()} treninga od posljednjeg izvoza.</div></div>`:""}<div class="sm mute" style="margin-bottom:10px">Podaci žive samo na ovom telefonu. Napravi kopiju s vremena na vreme.</div><div class="btnrow"><button class="btn grow" id="exp">Izvezi podatke</button><button class="btn gh grow" id="imp">Uvezi</button></div>${localStorage.getItem(PREIMPORT_KEY)?`<button class="btn gh" style="width:100%;margin-top:8px" id="restorePreImport">Vrati stanje prije posljednjeg importa</button>`:""}<input type="file" id="impF" accept="application/json" hidden></div><button class="btn gh danger" style="width:100%" id="reset">Obriši sve podatke</button>`;$("#cEdit").onclick=()=>editCycleDialog(c);$("#cNovi").onclick=()=>newCycleDialog();$("#view").querySelectorAll("[data-mcopen]").forEach(x=>x.onclick=()=>go("vise",{mc:x.dataset.mcopen,title:"Mezociklus"}));$("#exp").onclick=()=>{S.schemaVersion=SCHEMA_VERSION;S._backupTrainingCount=backupTrainingCount();S._lastBackup=iso(new Date());save();const b=new Blob([JSON.stringify(S,null,1)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="trening-"+iso(new Date())+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)};$("#imp").onclick=()=>$("#impF").click();$("#impF").onchange=e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!validateImport(d))throw 0;const incoming=stateSummary(d),current=stateSummary(S);const less=incoming.sets<current.sets?`\n\nUPOZORENJE: kopija ima ${current.sets-incoming.sets} setova manje od trenutnog stanja.`:"";const msg=`Uvozim ${incoming.sets} setova, ${incoming.cycles} mezociklusa, posljednji trening ${incoming.last}.\n\nTrenutno imaš ${current.sets} setova i ${current.cycles} mezociklusa.${less}\n\nZameniti trenutne podatke?`;if(confirm(msg)&&(!less||confirm("Kopija ima manje podataka. Zaista nastaviti sa uvozom?"))){localStorage.setItem(PREIMPORT_KEY,JSON.stringify(S));S=d;runMigrations();render();toast("Uvezeno · prethodno stanje sačuvano")}}catch(err){toast("Fajl nije ispravan ili verzija nije podržana")}};r.readAsText(file)};const rp=$("#restorePreImport");if(rp)rp.onclick=()=>{if(!confirm("Vratiti stanje prije posljednjeg importa?"))return;try{const raw=localStorage.getItem(PREIMPORT_KEY);const d=JSON.parse(raw);if(!validateImport(d))throw 0;S=d;runMigrations();render();toast("Prethodno stanje vraćeno")}catch(e){toast("Sačuvano stanje nije ispravno")}};$("#reset").onclick=()=>{if(confirm("Obrisati sve? Ovo se ne može poništiti.")&&confirm("Sigurno? Napravi kopiju pre brisanja.")){localStorage.removeItem(KEY);sessionClear();load();runMigrations();requestPersistentStorage();render();toast("Obrisano")}}}
function openDlg(html){$("#dlgBody").innerHTML=html;$("#dlg").showModal()}function closeDlg(){$("#dlg").close()}$("#dlg").addEventListener("click",e=>{if(e.target===$("#dlg"))closeDlg()});
load();runMigrations();render();
const pending=pendingSession();
if(pending){
  const s=pending.session;
  const when=new Date(s.startTs||pending.savedAt);
  const hh=String(when.getHours()).padStart(2,"0"),mm=String(when.getMinutes()).padStart(2,"0");
  if(confirm(`Imaš nezavršen trening od ${hh}:${mm}. Nastavi?`)){sesija=s;go("danas")}
  else if(confirm("Odbaciti sačuvani nezavršeni trening?"))sessionClear();
}

  window.addEventListener("load",async()=>{
    try{
      const reg=await navigator.serviceWorker.register("./sw.js");
      reg.update().catch(()=>{});
    }catch(e){}
  });
}
